roleTitle=Дублирование имени персонажа
roleContent=Уважаемый игрок!\nВ связи с объединением серверов было обнаружено дублирование имени вашего персонажа. Мы отправили вам карту смены имени. Пожалуйста, используйте её, чтобы бесплатно изменить имя вашего персонажа. Благодарим за поддержку, желаем приятной игры!
guildTitle=Дублирование названия гильдии
