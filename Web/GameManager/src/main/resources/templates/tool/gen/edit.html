<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Редактирование генерации кода')" />
    <th:block th:include="include :: select2-css" />
    <style type="text/css">
        .select-table table{table-layout:fixed;}.table>thead>tr>th{text-align:center;}.select-table .table td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.form-control{padding:3px 6px 4px;height:30px;}.icheckbox-blue{top:0px;left:6px;}.form-control.select2-hidden-accessible{position:static!important;}.select-table table label.error{position: inherit;}select + label.error{z-index:1;right:40px;}
    </style>
</head>
<body class="gray-bg" style="font: 14px Helvetica Neue, Helvetica, PingFang SC, 微软雅黑, Tahoma, Arial, sans-serif !important;">
    <section class="section-content">
    <div class="row">
        <div class="col-xs-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content" style="border-style:none;">
                    <div class="nav-tabs-custom">
                        <ul class="nav nav-tabs">
                            <li><a href="#tab-basic" data-toggle="tab" aria-expanded="false">Основная информация</a></li>
                            <li class="active"><a href="#tab-field" data-toggle="tab" aria-expanded="true">Информация о полях</a></li>
                            <li><a href="#tab-gen" data-toggle="tab" aria-expanded="false">Настройки генерации</a></li>
                            <li class="pull-right header">
                                <i class="fa fa-code"></i> Настройка генерации
                            </li>
                        </ul>
                        <form id="form-gen-edit" class="form-horizontal" th:object="${table}">
                        <input name="tableId" type="hidden" th:field="*{tableId}" />
                        <div class="tab-content">
                            <!-- Основная информация -->
                            <div class="tab-pane" id="tab-basic">
                            <div class="row mt20">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required">Название таблицы:</label>
                                        <div class="col-sm-8">
                                            <input name="tableName" class="form-control" type="text" placeholder="Введите название таблицы" maxlength="200" th:field="*{tableName}" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required">Описание таблицы:</label>
                                        <div class="col-sm-8">
                                            <input name="tableComment" class="form-control" type="text" placeholder="Введите описание таблицы" maxlength="500" th:field="*{tableComment}" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required">Имя класса сущности:</label>
                                        <div class="col-sm-8">
                                            <input name="className" class="form-control" type="text" placeholder="Введите имя класса сущности" maxlength="100" th:field="*{className}" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required">Автор:</label>
                                        <div class="col-sm-8">
                                            <input name="functionAuthor" class="form-control" type="text" placeholder="Введите имя автора" maxlength="50" th:field="*{functionAuthor}" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-12">
                                    <div class="form-group">
                                        <label class="col-xs-2 control-label">Примечание:</label>
                                        <div class="col-xs-10">
                                            <textarea name="remark" maxlength="500" class="form-control" rows="3"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            </div>

                            <!-- Информация о полях -->
                            <div class="tab-pane active" id="tab-field">
                                <div class="select-table table-striped" style="margin-top: 0px;padding-top: 0px;padding-bottom: 0px;">
                                    <table id="bootstrap-table" data-use-row-attr-func="true" data-reorderable-rows="true"></table>
                                </div>
                            </div>

                            <!-- Настройки генерации -->
                            <div class="tab-pane" id="tab-gen">
                            <div class="row mt20">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required">Шаблон генерации:</label>
                                        <div class="col-sm-8">
                                            <select class='form-control' id="tplCategory" name='tplCategory' style="width: 100%">
                                                <option value="crud" th:field="*{tplCategory}">Одна таблица (CRUD)</option>
                                                <option value="tree" th:field="*{tplCategory}">Древовидная таблица (CRUD)</option>
                                                <option value="sub" th:field="*{tplCategory}">Главная-подчинённая (CRUD)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Пакет Java, например com.gm.project.system">Пакет генерации: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <input name="packageName" class="form-control" type="text" placeholder="Введите путь пакета" maxlength="100" th:field="*{packageName}" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Имя подсистемы, например system">Имя модуля: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <input name="moduleName" class="form-control" type="text" placeholder="Введите имя модуля" maxlength="30" th:field="*{moduleName}" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Имя функции на английском, например user">Имя бизнес-функции: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <input name="businessName" class="form-control" type="text" placeholder="Введите имя бизнес-функции" maxlength="50" th:field="*{businessName}" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Описание класса, например Пользователь">Имя функции: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <input name="functionName" class="form-control" type="text" placeholder="Введите имя функции" maxlength="50" th:field="*{functionName}" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Родительское меню, например Системное управление">Родительское меню: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <input id="parentMenuId" name="params[parentMenuId]" type="hidden" th:value="*{parentMenuId}"/>
                                            <div class="input-group">
                                                <input id="parentMenuName" name="params[parentMenuName]" class="form-control" type="text" onclick="selectMenuTree()" placeholder="Выберите родительское меню" maxlength="50" th:value="*{parentMenuName}" required>
                                                <span class="input-group-addon"><i class="fa fa-search"></i></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label" title="По умолчанию — загрузка ZIP-архива, можно указать свой путь">Способ генерации кода: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <label class="radio-box"> <input type="radio" name="genType" value="0" th:field="*{genType}" /> ZIP-архив </label>
                                            <label class="radio-box"> <input type="radio" name="genType" value="1" th:field="*{genType}" /> Пользовательский путь </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="hidden row" id="pathinfo">
                                <div class="col-sm-12">
                                    <div class="form-group">
                                        <label class="col-xs-2 control-label" title="Абсолютный путь на диске. Если не указан, генерируется в текущий Web-проект">Базовый путь генерации: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-xs-10">
                                            <div class="input-group input-group-sm">
                                                <input id="genPath" name="genPath" class="form-control" type="text" th:field="*{genPath}" placeholder="Введите путь к проекту" maxlength="200">
                                                <div class="input-group-btn">
                                                    <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown">Быстрый выбор пути <span class="caret"></span></button>
                                                    <ul class="dropdown-menu dropdown-menu-right" role="menu">
                                                        <li><a href="javascript:$('#genPath').val('/')"><i class="fa fa-refresh"></i>Восстановить путь по умолчанию</a></li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="hidden" id="subInfo">
                            <h4 class="form-header h4">Информация о связях</h4>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Имя связанной подчинённой таблицы, например sys_user">Имя подчинённой таблицы: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <select class='type form-control' id="subTableName" name='subTableName' th:attr='data-value=*{subTableName}' style="width: 100%">
                                                <option value="">--- Выберите ---</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Имя внешнего ключа подчинённой таблицы, например user_id">Имя внешнего ключа: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <select class='router form-control' id="subTableFkName" name='subTableFkName' th:attr='data-value=*{subTableFkName}' style="width: 100%">
                                                <option value="">--- Выберите ---</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            </div>
                            <div class="hidden" id="otherInfo">
                            <h4 class="form-header h4">Дополнительная информация</h4>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Имя поля кода дерева, например dept_id">Поле кода дерева: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <select class='form-control' id="treeCode" name='params[treeCode]' style="width: 100%">
                                                <option value="">--- Выберите ---</option>
                                                <option th:each="column : ${table.columns}" th:text="${column.columnName + '：' + column.columnComment}" th:value="${column.columnName}" th:field="*{treeCode}"></option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Имя поля родительского кода дерева, например parent_Id">Поле родительского кода: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <select class='form-control' id="treeParentCode" name='params[treeParentCode]' style="width: 100%">
                                                <option value="">--- Выберите ---</option>
                                                <option th:each="column : ${table.columns}" th:text="${column.columnName + '：' + column.columnComment}" th:value="${column.columnName}" th:field="*{treeParentCode}"></option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="form-group">
                                        <label class="col-sm-4 control-label is-required" title="Имя поля отображаемого имени узла, например dept_name">Поле имени узла: <i class="fa fa-question-circle-o"></i></label>
                                        <div class="col-sm-8">
                                            <select class='form-control' id="treeName" name='params[treeName]' style="width: 100%">
                                                <option value="">--- Выберите ---</option>
                                                <option th:each="column : ${table.columns}" th:text="${column.columnName + '：' + column.columnComment}" th:value="${column.columnName}" th:field="*{treeName}"></option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            </div>
                            </div>
                        </div>
                        </form>
                    </div>
                </div>
               <div class="box-footer">
                   <div class="col-sm-offset-5 col-sm-6">
                       <button type="button" class="btn btn-sm btn-primary" onclick="submitHandler()"><i class="fa fa-check"></i>Сохранить</button>&nbsp;
                       <button type="button" class="btn btn-sm btn-danger" onclick="closeItem()"><i class="fa fa-reply-all"></i>Закрыть</button>
                   </div>
               </div>
            </div>
        </div>
    </div>
    </section>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-table-reorder-js" />
    <script th:src="@{/js/jquery.tmpl.js}"></script>
    <th:block th:include="include :: jquery-cxselect-js" />
    <script th:inline="javascript">
        /* Информация о пользователе — редактирование */
        $("#form-table-edit").validate({
            rules: {
                tableName: {
                    required: true,
                },
            },
            focusCleanup: true
        });

        /* Каскадная информация о таблице */
        var data = [[${data}]];
        $('#subInfo').cxSelect({
            selects: ['type', 'router'],
            jsonValue: 'v',
            data: data
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.saveTab(prefix + "/edit", $("#form-gen-edit").serializeArray());
            }
        }

        var prefix = ctx + "tool/gen";
        $(function() {
            var options = {
                url: prefix + "/column/list",
                sortName: "sort",
                sortOrder: "desc",
                height: $(window).height() - 166,
                pagination: false,
                showSearch: false,
                showRefresh: false,
                showToggle: false,
                showColumns: false,
                onLoadSuccess: onLoadSuccess,
                onReorderRow: onReorderRow,
                columns: [{
                    title: "№",
                    width: "5%",
                    formatter: function (value, row, index) {
                        // Скрытое поле ID колонки
                        var columnIdHtml = $.common.sprintf("<input type='hidden' name='columns[%s].columnId' value='%s'>", index, row.columnId);
                        // Скрытое поле сортировки
                        var sortHtml = $.common.sprintf("<input type='hidden' name='columns[%s].sort' value='%s' id='columns_sort_%s'>", index, row.sort, row.columnId);
                        return columnIdHtml + sortHtml + $.table.serialNumber(index);
                    },
                    cellStyle: function(value, row, index) {
                        return { css: { "cursor": "move" } };
                    }
                },
                {
                    field: 'columnName',
                    title: 'Имя поля',
                    width: "10%",
                    class: "nodrag",
                    cellStyle: function(value, row, index) {
                        return { css: { "cursor": "default" } };
                    }
                },
                {
                    field: 'columnComment',
                    title: 'Описание поля',
                    width: "10%",
                    formatter: function (value, row, index) {
                        var html = $.common.sprintf("<input class='form-control' type='text' name='columns[%s].columnComment' value='%s'>", index, value);
                        return html;
                    }
                },
                {
                    field: 'columnType',
                    title: 'Физический тип',
                    width: "10%",
                    class: "nodrag",
                    cellStyle: function(value, row, index) {
                        return { css: { "cursor": "default" } };
                    }
                },
                {
                    field: 'javaType',
                    title: 'Тип Java',
                    width: "10%",
                    formatter: function (value, row, index) {
                        var data = [{ index: index, javaType: value }];
                        return $("#javaTypeTpl").tmpl(data).html();
                    }
                },
                {
                    field: 'javaField',
                    title: 'Свойство Java',
                    width: "10%",
                    formatter: function (value, row, index) {
                        var html = $.common.sprintf("<input class='form-control' type='text' name='columns[%s].javaField' value='%s' required>", index, value);
                        return html;
                    }
                },
                {
                    field: 'isInsert',
                    title: 'Вставка',
                    width: "5%",
                    formatter: function (value, row, index) {
                        var isCheck = value == 1 ? 'checked' : '';
                        var html = $.common.sprintf("<label class='check-box'><input type='checkbox' name='columns[%s].isInsert' value='1' %s></label>", index, isCheck);
                        return html;
                    }
                },
                {
                    field: 'isEdit',
                    title: 'Редактирование',
                    width: "5%",
                    formatter: function (value, row, index) {
                        var isCheck = value == 1 ? 'checked' : '';
                        var html = $.common.sprintf("<label class='check-box'><input type='checkbox' name='columns[%s].isEdit' value='1' %s></label>", index, isCheck);
                        return html;
                    }
                },
                {
                    field: 'isList',
                    title: 'Список',
                    width: "5%",
                    formatter: function (value, row, index) {
                        var isCheck = value == 1 ? 'checked' : '';
                        var html = $.common.sprintf("<label class='check-box'><input type='checkbox' name='columns[%s].isList' value='1' %s></label>", index, isCheck);
                        return html;
                    }
                },
                {
                    field: 'isQuery',
                    title: 'Поиск',
                    width: "5%",
                    formatter: function (value, row, index) {
                        var isCheck = value == 1 ? 'checked' : '';
                        var html = $.common.sprintf("<label class='check-box'><input type='checkbox' name='columns[%s].isQuery' value='1' %s></label>", index, isCheck);
                        return html;
                    }
                },
                {
                    field: 'queryType',
                    title: 'Тип поиска',
                    width: "10%",
                    formatter: function (value, row, index) {
                        var data = [{ index: index, queryType: value }];
                        return $("#queryTypeTpl").tmpl(data).html();
                    }
                },
                {
                    field: 'isRequired',
                    title: 'Обязательное',
                    width: "5%",
                    formatter: function (value, row, index) {
                        var isCheck = value == 1 ? 'checked' : '';
                        var html = $.common.sprintf("<label class='check-box'><input type='checkbox' name='columns[%s].isRequired' value='1' %s></label>", index, isCheck);
                        return html;
                    }
                },
                {
                    field: 'htmlType',
                    title: 'Тип отображения',
                    width: "12%",
                    formatter: function (value, row, index) {
                        var data = [{ index: index, htmlType: value }];
                        return $("#htmlTypeTpl").tmpl(data).html();
                    }
                },
                {
                    field: 'dictType',
                    title: 'Тип словаря',
                    width: "13%",
                    formatter: function (value, row, index) {
                        var html = $.common.sprintf("<input class='form-control' type='text' name='columns[%s].dictType' value='%s' id='columns_dict_%s'>", index, value, row.columnId);
                        return "<div class='input-group'>" + html + "<span class='input-group-addon input-sm' onclick='selectDictTree(" + row.columnId + ", this)'><i class='fa fa-search'></i></span></div>";
                    },
                    cellStyle: function(value, row, index) {
                        return { css: { "cursor": "default" } };
                    }
                }]
            };
            $.table.init(options);
        });

        // Обработчик загрузки всех данных
        function onLoadSuccess(data){
            $.fn.select2.defaults.set( "theme", "bootstrap" );
            $("select.form-control").each(function () {
                $(this).select2().on("change", function () {
                    $(this).valid();
                })
            })
            $(".check-box").each(function() {
                $(this).iCheck({
                    checkboxClass: 'icheckbox-blue'
                })
            })
        }

        // Обработчик после перетаскивания строк
        function onReorderRow(data) {
            for (var i = 0; i < data.length; i++) {
                $("#columns_sort_" + data[i].columnId).val(i+1);
            }
        }

        $(function() {
            var tplCategory = $("#tplCategory option:selected").val();
            tplCategoryVisible(tplCategory);
            var genType = $('input[name="genType"]:checked').val();
            pathInfoVisible(genType);
        });

        $('#tplCategory').on('select2:select', function (event) {
            var tplCategory = $(event.target).val();
            tplCategoryVisible(tplCategory);
        });

        function tplCategoryVisible(tplCategory) {
            if("crud" == tplCategory){
                $("#treeCode").select2("val", [""]);
                $("#treeParentCode").select2("val", [""]);
                $("#treeName").select2("val", [""]);
                $("#otherInfo").addClass("hidden");
                $("#subInfo").addClass("hidden");
            } else if("tree" == tplCategory){
                $("#otherInfo").removeClass("hidden");
                $("#treeCode").attr("required", "true");
                $("#treeParentCode").attr("required", "true");
                $("#treeName").attr("required", "true");
                $("#subInfo").addClass("hidden");
            } else if("sub" == tplCategory){
                $("#subInfo").removeClass("hidden");
                $("#treeCode").select2("val", [""]);
                $("#treeParentCode").select2("val", [""]);
                $("#treeName").select2("val", [""]);
                $("#subTableName").attr("required", "true");
                $("#subTableFkName").attr("required", "true");
                $("#otherInfo").addClass("hidden");
            }
        }

        $('input').on('ifChecked', function(event){
            var genType = $(event.target).val();
            pathInfoVisible(genType);
        });

        function pathInfoVisible(genType) {
            if("0" == genType){
                $("#genPath").val("/");
                $("#pathinfo").addClass("hidden");
            } else if("1" == genType){
                $("#pathinfo").removeClass("hidden");
            }
        }

        // Выбор типа словаря
        function selectDictTree(columnId, obj) {
            var dictType = $.common.nullToStr($(obj).parent().find("input").val());
            var url = ctx + "system/dict/selectDictTree/" + columnId + "/" + dictType;
            var options = {
                title: 'Выбор типа словаря',
                width: "380",
                url: url,
                callBack: doDictSubmit
            };
            $.modal.openOptions(options);
        }

        // Выбор меню
        function selectMenuTree() {
            var parentMenuId = $("#parentMenuId").val();
            var menuId = parentMenuId > 0 ? parentMenuId : 1;
            var url = ctx + "system/menu/selectMenuTree/" + menuId;
            var options = {
                title: 'Выбор меню',
                width: "380",
                url: url,
                callBack: doMenuSubmit
            };
            $.modal.openOptions(options);
        }

        function doDictSubmit(index, layero){
            var body = layer.getChildFrame('body', index);
            var columnId = body.find('#columnId').val();
            var dictType = body.find('#dictType').val();
            layer.close(index);
            $("#columns_dict_" + columnId).val(dictType);
        }

        function doMenuSubmit(index, layero){
            var body = layer.getChildFrame('body', index);
            $("#parentMenuId").val(body.find('#treeId').val());
            $("#parentMenuName").val(body.find('#treeName').val());
            layer.close(index);
        }
    </script>
</body>
</html>
