<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список генерации кода')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="gen-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                Название таблицы: <input type="text" name="tableName"/>
                            </li>
                            <li>
                                Описание таблицы: <input type="text" name="tableComment"/>
                            </li>
                            <li class="select-time">
                                <label>Время таблицы:</label>
                                <input type="text" class="time-input" id="startTime" placeholder="Начало" name="params[beginTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" id="endTime" placeholder="Окончание" name="params[endTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success multiple disabled" onclick="javascript:batchGenCode()" shiro:hasPermission="tool:gen:code">
                    <i class="fa fa-download"></i> Генерация
                </a>
                <a class="btn btn-info" onclick="importTable()">
                    <i class="fa fa-upload"></i> Импорт
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.editTab()" shiro:hasPermission="tool:gen:edit">
                    <i class="fa fa-edit"></i> Редактировать
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="tool:gen:remove">
                    <i class="fa fa-remove"></i> Удалить
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: bootstrap-table-export-js" />
    <script th:src="@{/ajax/libs/highlight/highlight.min.js}"></script>
    <script th:inline="javascript">
        var prefix = ctx + "tool/gen";
        var editFlag = [[${@permission.hasPermi('tool:gen:edit')}]];
        var removeFlag = [[${@permission.hasPermi('tool:gen:remove')}]];
        var previewFlag = [[${@permission.hasPermi('tool:gen:preview')}]];
        var codeFlag = [[${@permission.hasPermi('tool:gen:code')}]];

        $(function() {
            var options = {
                url: prefix + "/list",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                sortName: "createTime",
                sortOrder: "desc",
                showExport: true,
                modalName: "Настройки генерации",
                rememberSelected: true,
                uniqueId: "tableId",
                columns: [{
                    field: 'state',
                    checkbox: true
                },
                {
                    field: 'tableId',
                    title: 'ID',
                    visible: false
                },
                {
                    title: "№",
                    formatter: function (value, row, index) {
                        return $.table.serialNumber(index);
                    }
                },
                {
                    field: 'tableName',
                    title: 'Название таблицы',
                    sortable: true,
                    formatter: function(value, row, index) {
                        return $.table.tooltip(value);
                    }
                },
                {
                    field: 'tableComment',
                    title: 'Описание таблицы',
                    sortable: true,
                    formatter: function(value, row, index) {
                        return $.table.tooltip(value, 15);
                    }
                },
                {
                    field: 'className',
                    title: 'Имя класса сущности',
                    sortable: true
                },
                {
                    field: 'createTime',
                    title: 'Время создания',
                    sortable: true
                },
                {
                    field: 'updateTime',
                    title: 'Время обновления',
                    sortable: true
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-info btn-xs ' + previewFlag + '" href="javascript:void(0)" onclick="preview(\'' + row.tableId + '\')"><i class="fa fa-search"></i>Предпросмотр</a> ');
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.tableId + '\')"><i class="fa fa-edit"></i>Редактировать</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.tableId + '\')"><i class="fa fa-remove"></i>Удалить</a> ');
                        actions.push('<a class="btn btn-warning btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="synchDb(\'' + row.tableName + '\')"><i class="fa fa-refresh"></i>Синхронизация</a> ');
                        actions.push('<a class="btn btn-primary btn-xs ' + codeFlag + '" href="javascript:void(0)" onclick="genCode(\'' + row.tableName + '\',\'' + row.genType + '\')"><i class="fa fa-bug"></i>Генерация кода</a> ');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        // Предпросмотр кода
        function preview(tableId) {
            var preViewUrl = prefix + "/preview/" + tableId;
            $.modal.loading("Загрузка данных, пожалуйста, подождите...");
            $.get(preViewUrl, function(result) {
                if (result.code == web_status.SUCCESS) {
                    var items = [];
                    $.each(result.data, function(index, value) {
                        var templateName = index.substring(index.lastIndexOf("/") + 1, index.length).replace(/\.vm/g, "");
                        if(!$.common.equals("sql", templateName) && !$.common.equals("tree.html", templateName) && !$.common.equals("sub-domain.java", templateName)){
                            var language = templateName.substring(templateName.lastIndexOf(".") + 1);
                            var highCode = hljs.highlight(language, value).value;
                            items.push({
                                title: templateName, content: "<pre class=\"layui-code\"><code>" + highCode + "</code></pre>"
                            })
                        }
                    });
                    top.layer.tab({
                        area: ['90%', '90%'],
                        shadeClose: true,
                        success: function(layero, index){
                            parent.loadCss(ctx + "ajax/libs/highlight/default.min.css");
                        },
                        tab: items
                    });
                } else {
                    $.modal.alertError(result.msg);
                }
                $.modal.closeLoading();
            });
        }

        // Генерация кода
        function genCode(tableName, genType) {
            $.modal.confirm("Подтвердить генерацию кода для таблицы " + tableName + "?", function() {
                if(genType === "0") {
                    location.href = prefix + "/download/" + tableName;
                    layer.msg('Генерация кода выполняется, пожалуйста, подождите...', { icon: 1 });
                } else if(genType === "1") {
                    $.operate.get(prefix + "/genCode/" + tableName);
                }
            })
        }

        // Синхронизация с базой данных
        function synchDb(tableName){
            $.modal.confirm("Подтвердить принудительную синхронизацию структуры таблицы " + tableName + "?", function() {
                $.operate.get(prefix + "/synchDb/" + tableName);
            })
        }

        // Массовая генерация кода
        function batchGenCode() {
            var rows = $.table.selectColumns("tableName");
            if (rows.length == 0) {
                $.modal.alertWarning("Выберите данные для генерации");
                return;
            }
            $.modal.confirm("Подтвердить генерацию кода для выбранных " + rows.length + " таблиц?", function() {
                location.href = prefix + "/batchGenCode?tables=" + rows;
                layer.msg('Генерация кода выполняется, пожалуйста, подождите...', { icon: 1 });
            });
        }

        // Импорт структуры таблицы
        function importTable() {
            var importTableUrl = prefix + "/importTable";
            $.modal.open("Импорт структуры таблицы", importTableUrl);
        }
    </script>
</body>
</html>
