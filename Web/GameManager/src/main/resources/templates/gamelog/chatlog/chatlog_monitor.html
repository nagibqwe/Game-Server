<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Журнал мониторинга чата')"/>
    <th:block th:include="include :: footer"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="row select-list" style="padding-left: 15px; margin-bottom: 10px;">
                    <li>
                        <div th:replace="common/select_server_single.html"></div>
                        <!-- Здесь настраивается сопоставление адресов групповых запросов к серверу -->
                        <input type="hidden" id="requestUrl" value="selectServerList">
                        <input type="hidden" id="ignoreMerge" value="0">
                        <input type="hidden" id="serverTypeList" value="0,1">

                        <input type="hidden" id="chatlogUrl" value="/chatlog_monitor">

                    </li>
                    <li>
                        <label style="width: auto">Таблица логов:</label>&nbsp;
                    </li>
                    <li>
                        <select class="selectClass" id="tableNameList" name="tableNameList" data-first-title="Пожалуйста, выберите сервер"></select>
                    </li>
                    <div th:replace="common/stat_date_head2.html"></div>

                </div>
                <div class="row select-list" style="padding-left: 15px; margin-bottom: 10px;">
                    <ul>
                        <li>
                            <label>ID персонажа:</label>
                            <input type="text" name="roleId"/>
                        </li>
                        <li>
                            <label>Уровень:</label>
                            <input style="width: 60px" type="text" name="level"/>
                        </li>
                        <li>
                            <label>ID получателя:</label>
                            <input type="text" name="receRoleId"/>
                        </li>
                        <li>
                            <label>Тип чата:</label>
                            <input type="text" style="width: 60px" name="channel"/>
                        </li>
                        <div th:replace="common/stat_search_head.html"></div>
                    </ul>
                </div>
            </form>
        </div>
        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-danger multiple disabled" onclick="batchBanAccount()">
                <i></i> Массовая блокировка аккаунтов
            </a>
            <a class="btn btn-danger multiple disabled" onclick="batchBanChat()">
                <i></i> Массовая блокировка чата
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" style="word-break:break-all; word-wrap:break-word;"></table>
        </div>
    </div>
</div>
<div th:replace="common/chatlogCommon.html"></div>
</body>
</html>
