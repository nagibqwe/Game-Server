<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Журнал динамики гильдий')" />
    <th:block th:include="include :: footer" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="row select-list" style="padding-left: 15px; margin-bottom: 10px;">
                        <ul>
                            <li>
                                <div th:replace="common/select_server_single.html"></div>
                                <!-- Здесь настраивается сопоставление адресов групповых запросов к серверу -->
                                <input type="hidden" id="requestUrl" value="selectServerList">
                                <input type="hidden" id="ignoreMerge" value="0">
                                <input type="hidden" id="serverTypeList" value="0,1">
                            </li>
                            <li>
                                <label>ID гильдии:</label>
                                <input type="text" name="guildId"/>
                                <input type="hidden" name="queryType" value="2"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="gamelog:guildbaselog:export">
                    <i class="fa fa-download"></i> Экспорт
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('gamelog:guildbaselog:edit')}]];
        var removeFlag = [[${@permission.hasPermi('gamelog:guildbaselog:remove')}]];
        var prefix = ctx + "gamelog/guildbaselog";

        $(function() {
            var options = {
                url: prefix + "/list",
                exportUrl: prefix + "/export",
                modalName: "Динамика гильдий",
                pagination: false,
                firstLoad: false,
                columns: [
                {
                    field: 'id',
                    title: 'ID',
                    visible: false
                },
                {
                    field: 'guildId',
                    title: 'ID гильдии'
                },
                {
                    field: 'roleId',
                    title: 'ID персонажа'
                },
                {
                    field: 'platformName',
                    title: 'Название канала'
                },
                {
                    field: 'param',
                    title: 'Дополнительные параметры'
                },
                {
                    field: 'sid',
                    title: 'ID сервера'
                },
                {
                    field: 'guildName',
                    title: 'Название гильдии'
                },
                {
                    field: 'roleName',
                    title: 'Имя персонажа'
                },
                {
                    field: 'userId',
                    title: 'ID пользователя'
                },
                {
                    field: 'actionId',
                    title: 'Уникальный ID операции'
                },
                {
                    field: 'time',
                    title: 'Время записи'
                },
                {
                    field: 'actId',
                    title: 'ID целевого персонажа'
                },
                {
                    field: 'actName',
                    title: 'Имя целевого персонажа'
                },
                {
                    field: 'type',
                    title: 'Тип операции: 1 — создание гильдии, 2 — роспуск гильдии, 3 — вступление в гильдию, 4 — выход из гильдии, 5 — исключение из гильдии, 6 — настройка информации гильдии, 7 — переименование гильдии, 8 — начало импичмента лидера, 9 — отмена импичмента лидера, 10 — успешный импичмент лидера'
                }
                ]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
