<head>

                                <li>

            <div class="btn-group-sm" id="toolbar" role="group">

        </div>
    </div>

    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('stat:stat_career_distribute:edit')}]];
        var removeFlag = [[${@permission.hasPermi('stat:stat_career_distribute:remove')}]];
        var prefix = ctx + "gmquerydata/rankinglist";

        $(function() {
            var options = {
                url: prefix + "/list",
                exportUrl: prefix + "/export",
                modalName: "Запрос рейтинга в реальном времени",
                pagination: false,
                firstLoad:false,
                columns: [{
                    checkbox: true
                },
                {
                    field: 'rank',
                    title: 'Место'
                },
                {
                    field: 'roleId',
                    title: 'ID персонажа'
                },{
                    field: 'roleName',
                    title: 'Имя персонажа'
                },{
                    field: 'rankData',
                    title: 'Данные рейтинга'
                }]
            };
            $.table.init(options);
        });
