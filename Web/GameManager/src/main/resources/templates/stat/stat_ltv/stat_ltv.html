<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Статистика LTV')" />
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: bootstrap-table-export-js" />
</head>
<body class="gray-bg">

     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div th:replace="common/stat_group_server_head.html"></div>
                    <div class="row select-list" style="padding-left: 15px; margin-bottom: 10px;">
                        <ul>
                            <div th:replace="common/stat_date_head.html"></div>
                            <div th:replace="common/stat_black_list_head.html"></div>
                            <div th:replace="common/stat_search_head.html"></div>
                        </ul>
                    </div>
                </form>
            </div>



            <div class="btn-group-sm" id="toolbar" role="group">
                <div class="btn-group">
                </div>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
     <script th:inline="javascript">
         var prefix = ctx + "stat/stat_ltv";
         var helptip = "<span style='color:Black'> " +
             "<b>Пояснение к метрикам (нажмите Esc для закрытия)</b></br>" +
             "- Новые зарегистрированные пользователи: общее количество пользователей, вошедших в этот день (по уникальным аккаунтам)</br>" +
             "- LTV7 ARPU: сумма пополнений за 7 дней / количество новых игроков</br>" +
             "- LTV7 Сумма пополнений: сумма пополнений новых игроков за дни 1-7 (например, новый пользователь 1-го числа, пополнения за 1-7 числа)</br>" +
             "</span>";
         $(function() {
             $("button[name='group_tab']").bind("click",function(e){
                 $("button[name='group_tab']").removeClass();
                 $("button[name='group_tab']").addClass("btn btn-white");
                 $("#"+e.target.id+"").removeClass();
                 $("#"+e.target.id+"").addClass("btn btn-primary");
                 $.table.destroy('bootstrap-table');
                 initRemainTable(e.target.id);
             });
             // По умолчанию инициализируем первую таблицу
             initTable();
         });

         /**
          * Таблица удержания
          * @param name
          */
         function initTable() {
             var options = {
                 pageSize: 10000000,
                 pageList: [],
                 //singleSelect: false,
                 url: prefix + "/list",
                 modalName: "LTV",
                 fixedColumns: true,
                 fixedNumber: 1,
                 striped: true,
                 firstLoad:false,
                 pagination: false,
                 showExport:true,
                 columns: [
                     {
                         field: 'caclStartTime',
                         title: 'Дата',
                         formatter: function(value, row, index) {
                             return  value.replace('-','/').replace('-','/');
                         }

                     },{
                         field: 'diffDay',
                         title: 'День',
                     }
                     ,{
                         field: 'currDayKeep',
                         title: 'LTV за сегодня',
                     },
                     {
                         field: 'caclNewCount',
                         title: "Количество новых игроков",
                     }]
             };
             var list = []
             for(var j = 1;j<31;j++ ){
                 list.push(j)
             }
             list.push(45);
             list.push(60);
             list.push(120);
             for(var i =0;i<list.length;i++){
                 options.columns.push({
                     field: 'ltv'+list[i],
                     title: 'LTV'+list[i],
                 });
             }
             $.table.init(options);
         }
     </script>
</body>
</html>
