<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuoYi - 404</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/animate.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
    <div class="middle-box text-center animated fadeInDown">
        <h1>404</h1>
        <h3 class="font-bold">Страница не найдена!</h3>
        <div class="error-desc">
            К сожалению, страница, которую вы ищете, не существует. Проверьте правильность URL-адреса, нажмите кнопку обновления в браузере или попробуйте найти что-то другое в нашем приложении.
            <a href="javascript:index()" class="btn btn-primary m-t">Главная</a>
        </div>
    </div>
    <script th:inline="javascript">
        var ctx = [[@{/}]];
        function index() {
            window.top.location = ctx + "index";
        }
    </script>
</body>
</html>
