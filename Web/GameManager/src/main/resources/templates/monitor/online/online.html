<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список пользователей онлайн')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="online-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                IP-адрес: <input type="text" name="ipaddr"/>
                            </li>
                            <li>
                                Логин: <input type="text" name="loginName"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-danger multiple disabled" onclick="javascript:batchForceLogout()" shiro:hasPermission="monitor:online:batchForceLogout">
                    <i class="fa fa-sign-out"></i> Принудительный выход
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: bootstrap-table-export-js" />
    <script th:inline="javascript">
        var forceFlag = [[${@permission.hasPermi('monitor:online:forceLogout')}]];
        var prefix = ctx + "monitor/online";

        $(function() {
            var options = {
                uniqueId: "sessionId",
                url: prefix + "/list",
                exportUrl: prefix + "/export",
                sortName: "lastAccessTime",
                sortOrder: "desc",
                showExport: true,
                escape: true,
                columns: [{
                    checkbox: true
                },
                {
                    title: "№",
                    formatter: function (value, row, index) {
                        return $.table.serialNumber(index);
                    }
                },
                {
                    field: 'sessionId',
                    title: 'ID сессии',
                    formatter: function(value, row, index) {
                        return $.table.tooltip(value);
                    }
                },
                {
                    field: 'loginName',
                    title: 'Логин',
                    sortable: true
                },
                {
                    field: 'deptName',
                    title: 'Отдел'
                },
                {
                    field: 'ipaddr',
                    title: 'IP-адрес'
                },
                {
                    field: 'loginLocation',
                    title: 'Местоположение'
                },
                {
                    field: 'browser',
                    title: 'Браузер'
                },
                {
                    field: 'os',
                    title: 'Операционная система'
                },
                {
                    field: 'status',
                    title: 'Статус сессии',
                    align: 'center',
                    formatter: function(value, row, index) {
                        if (value == 'on_line') {
                            return '<span class="badge badge-primary">В сети</span>';
                        } else if (value == 'off_line') {
                            return '<span class="badge badge-danger">Офлайн</span>';
                        }
                    }
                },
                {
                    field: 'startTimestamp',
                    title: 'Время входа',
                    sortable: true
                },
                {
                    field: 'lastAccessTime',
                    title: 'Последний доступ',
                    sortable: true
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var msg = '<a class="btn btn-danger btn-xs ' + forceFlag + '" href="javascript:void(0)" onclick="forceLogout(\'' + row.sessionId + '\')"><i class="fa fa-sign-out"></i>Принудительный выход</a> ';
                        return msg;
                    }
                }]
            };
            $.table.init(options);
        });

        // Принудительный выход (одиночный)
        function forceLogout(sessionId) {
            $.modal.confirm("Подтвердить принудительный выход пользователя?", function() {
                var data = { "ids": sessionId };
                $.operate.post(prefix + "/batchForceLogout", data);
            })
        }

        // Принудительный выход (массовый)
        function batchForceLogout() {
            var rows = $.table.selectColumns("sessionId");
            if (rows.length == 0) {
                $.modal.alertWarning("Выберите пользователей для принудительного выхода");
                return;
            }
            $.modal.confirm("Подтвердить принудительный выход для выбранных " + rows.length + " пользователей?", function() {
                var url = prefix + "/batchForceLogout";
                var data = { "ids": rows.join() };
                $.operate.post(url, data);
            });
        }
    </script>
</body>
</html>
