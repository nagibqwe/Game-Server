<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Журнал входов')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="logininfor-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>IP-адрес:</label><input type="text" name="ipaddr"/>
                            </li>
                            <li>
                                <label>Логин:</label><input type="text" name="loginName"/>
                            </li>
                            <li>
                                <label>Статус входа:</label><select name="status" th:with="type=${@dict.getType('sys_common_status')}">
                                    <option value="">Все</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li class="select-time">
                                <label>Время входа:</label>
                                <input type="text" class="time-input" id="startTime" placeholder="Начало" name="params[beginTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" id="endTime" placeholder="Окончание" name="params[endTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="monitor:logininfor:remove">
                    <i class="fa fa-remove"></i> Удалить
                </a>
                <a class="btn btn-danger" onclick="$.operate.clean()" shiro:hasPermission="monitor:logininfor:remove">
                    <i class="fa fa-trash"></i> Очистить всё
                </a>
                <a class="btn btn-primary single disabled" onclick="unlock()" shiro:hasPermission="monitor:logininfor:unlock">
                    <i class="fa fa-unlock"></i> Разблокировать
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="monitor:logininfor:export">
                    <i class="fa fa-download"></i> Экспорт
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var datas = [[${@dict.getType('sys_common_status')}]];
        var prefix = ctx + "monitor/logininfor";

        $(function() {
            var options = {
                url: prefix + "/list",
                cleanUrl: prefix + "/clean",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                sortName: "loginTime",
                sortOrder: "desc",
                modalName: "Журнал входов",
                escape: true,
                showPageGo: true,
                rememberSelected: true,
                columns: [{
                    field: 'state',
                    checkbox: true
                },
                {
                    field: 'infoId',
                    title: 'ID записи входа'
                },
                {
                    field: 'loginName',
                    title: 'Логин',
                    sortable: true
                },
                {
                    field: 'ipaddr',
                    title: 'IP-адрес'
                },
                {
                    field: 'loginLocation',
                    title: 'Местоположение'
                },
                {
                    field: 'browser',
                    title: 'Браузер'
                },
                {
                    field: 'os',
                    title: 'Операционная система'
                },
                {
                    field: 'status',
                    title: 'Статус входа',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(datas, value);
                    }
                },
                {
                    field: 'msg',
                    title: 'Сообщение'
                },
                {
                    field: 'loginTime',
                    title: 'Время входа',
                    sortable: true
                }]
            };
            $.table.init(options);
        });

        function unlock() {
            $.operate.post(prefix + "/unlock?loginName=" + $.table.selectColumns("loginName"));
        }
    </script>
</body>
</html>
