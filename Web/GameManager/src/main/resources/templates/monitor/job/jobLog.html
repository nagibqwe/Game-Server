<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Журнал выполнения задач')" />
</head>
<body class="gray-bg">

    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="jobLog-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                Название задачи: <input type="text" name="jobName" th:value="${job!=null?job.jobName:''}"/>
                            </li>
                            <li>
                                Группа задач: <select name="jobGroup" th:with="type=${@dict.getType('sys_job_group')}">
                                    <option value="">Все</option>
                                    <th:block th:if="${job==null}"><option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option></th:block>
                                    <th:block th:if="${job!=null}"><option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{job.jobGroup}"></option></th:block>
                                </select>
                            </li>
                            <li>
                                Статус выполнения: <select name="status" th:with="type=${@dict.getType('sys_common_status')}">
                                    <option value="">Все</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li class="select-time">
                                <label>Время выполнения:</label>
                                <input type="text" class="time-input" id="startTime" placeholder="Начало" name="params[beginTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" id="endTime" placeholder="Окончание" name="params[endTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="monitor:job:remove">
                    <i class="fa fa-remove"></i> Удалить
                </a>
                <a class="btn btn-danger" onclick="$.operate.clean()" shiro:hasPermission="monitor:job:remove">
                    <i class="fa fa-trash"></i> Очистить всё
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="monitor:job:export">
                    <i class="fa fa-download"></i> Экспорт
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var detailFlag = [[${@permission.hasPermi('monitor:job:detail')}]];
        var statusDatas = [[${@dict.getType('sys_common_status')}]];
        var groupDatas = [[${@dict.getType('sys_job_group')}]];
        var prefix = ctx + "monitor/jobLog";

        $(function() {
            var options = {
                url: prefix + "/list",
                cleanUrl: prefix + "/clean",
                detailUrl: prefix + "/detail/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                sortName: "createTime",
                sortOrder: "desc",
                modalName: "Журнал выполнения",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'jobLogId',
                    title: '№ записи журнала'
                },
                {
                    field: 'jobName',
                    title: 'Название задачи'
                },
                {
                    field: 'jobGroup',
                    title: 'Группа задач',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(groupDatas, value);
                    }
                },
                {
                    field: 'invokeTarget',
                    title: 'Целевой вызов',
                    formatter: function(value, row, index) {
                        return $.table.tooltip(value);
                    }
                },
                {
                    field: 'jobMessage',
                    title: 'Сообщение журнала'
                },
                {
                    field: 'status',
                    title: 'Статус',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(statusDatas, value);
                    }
                },
                {
                    field: 'createTime',
                    title: 'Время создания',
                    sortable: true
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-warning btn-xs ' + detailFlag + '" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.jobLogId + '\')"><i class="fa fa-search"></i>Детали</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
