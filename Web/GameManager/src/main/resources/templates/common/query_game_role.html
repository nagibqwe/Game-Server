<form id="formId">
    <div class="row select-list" style="padding-left: 15px; margin-bottom: 10px;">
        <ul>
            <li>
                <div th:replace="common/select_server_single.html"></div>
                <!-- Здесь настраивается сопоставление адресов групповых запросов к серверу -->
                <input type="hidden" id="requestUrl" value="selectServerList">
                <input type="hidden" id="ignoreMerge" value="1">
                <input type="hidden" id="serverTypeList" value="0,1">
            </li>
        </ul>


        <div class="select-list">
            <ul>
                <li>
                    <label>Тип поиска:</label>
                    <select name="queryType">
                        <option value="1">Имя персонажа</option>
                        <option value="2">Аккаунт платформы</option>
                        <option value="3">ID аккаунта платформы</option>
                        <option value="4">ID пользователя</option>
                        <option value="5">ID персонажа (десятичный)</option>
                        <option value="6">ID персонажа (36-ричный)</option>
                    </select>
                </li>
                <li>
                    <!--<label>Значение поиска:</label>-->
                    <input type="text" name="queryParam"/>
                </li>
                <li>
                    <a class="btn btn-primary btn-rounded btn-sm" onclick="roleSearch()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                </li>
            </ul>
        </div>
    </div>
</form>
