<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список резервных копий БД')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>ID сервера:</label>
                                <input type="text" name="serverId"/>
                            </li>
                            <li>
                                <label>Тип: 1 — игровая БД, 2 — БД журналов:</label>
                                <select name="type">
                                    <option value="">Все</option>
                                    <option value="-1">При генерации кода выберите атрибут словаря</option>
                                </select>
                            </li>
                            <li>
                                <label>Время создания:</label>
                                <input type="text" class="time-input" placeholder="Выберите время создания" name="createTime"/>
                            </li>
                            <li>
                                <label>Путь к резервной копии:</label>
                                <input type="text" name="url"/>
                            </li>
                            <li>
                                <label>Размер файла:</label>
                                <input type="text" name="size"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="gmtool:dbbak:add">
                    <i class="fa fa-plus"></i> Добавить
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="gmtool:dbbak:edit">
                    <i class="fa fa-edit"></i> Редактировать
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="gmtool:dbbak:remove">
                    <i class="fa fa-remove"></i> Удалить
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="gmtool:dbbak:export">
                    <i class="fa fa-download"></i> Экспорт
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('gmtool:dbbak:edit')}]];
        var removeFlag = [[${@permission.hasPermi('gmtool:dbbak:remove')}]];
        var prefix = ctx + "gmtool/dbbak";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "Резервные копии БД",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'ID',
                    visible: false
                },
                {
                    field: 'serverId',
                    title: 'ID сервера'
                },
                {
                    field: 'type',
                    title: 'Тип: 1 — игровая БД, 2 — БД журналов',
                    formatter: function(value, row, index) {
                        if(value == null){
                            return "";
                        }
                        return value == 1 ? "Игровая БД" : value == 2 ? "БД журналов" : "";
                    }
                },
                {
                    field: 'createTime',
                    title: 'Время создания'
                },
                {
                    field: 'url',
                    title: 'Путь к резервной копии'
                },
                {
                    field: 'size',
                    title: 'Размер файла'
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>Редактировать</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>Удалить</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
