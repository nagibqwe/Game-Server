<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Редактировать резервную копию БД')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-dbbak-edit" th:object="${dbbak}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">ID сервера:</label>
                <div class="col-sm-8">
                    <input name="serverId" th:field="*{serverId}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Тип:</label>
                <div class="col-sm-8">
                    <select name="type" class="form-control m-b" required>
                        <option value="1">Игровая база данных</option>
                        <option value="2">База данных журналов</option>
                    </select>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> При генерации кода выберите атрибут словаря</span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Время создания:</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="createTime" th:value="${#dates.format(dbbak.createTime, 'yyyy-MM-dd')}" class="form-control" placeholder="гггг-мм-дд" type="text" required>
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Путь к резервной копии:</label>
                <div class="col-sm-8">
                    <input name="url" th:field="*{url}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Размер файла:</label>
                <div class="col-sm-8">
                    <input name="size" th:field="*{size}" class="form-control" type="text" required>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/dbbak";
        $("#form-dbbak-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-dbbak-edit').serialize());
            }
        }

        $("input[name='createTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });
    </script>
</body>
</html>
