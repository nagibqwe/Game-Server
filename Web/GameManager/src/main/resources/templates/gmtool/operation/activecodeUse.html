<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Журнал использования активационных кодов')" />
    <th:block th:include="include :: footer" />
    <script>
        /**
         * Экспорт данных из текущей таблицы
         */
        function exportExcel() {
            $(".select-table").each(function () {
                if($(this).css("display") == "block"){
                    var table = $(this).find("table").eq(1);// После генерации создаётся 3 таблицы
                    var tableId = $(table).prop("id");
                    console.log(tableId);
                    $("#"+tableId).tableExport({type: 'excel', escape: 'false'});
                }
            });
        }

    </script>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="row select-list" style="padding-left: 15px; margin-bottom: 10px;">
                    <ul>
                        <li>
                            <div th:replace="common/select_server_single.html"></div>
                            <!-- Здесь настраивается сопоставление адресов групповых запросов к серверу -->
                            <input type="hidden" id="requestUrl" value="selectServerList">
                            <input type="hidden" id="ignoreMerge" value="0">
                            <input type="hidden" id="serverTypeList" value="0,1">
                        </li>

                    </ul>
                </div>
                <div class="select-list">
                    <ul>
                        <li>
                            <label>Активационный код:</label>
                            <input type="text" name="activeCode"/>
                        </li>
                        <li>
                            <label>ID персонажа:</label>
                            <input type="text" name="roleId"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="exportExcel()"><i class="fa fa-bookmark"></i>&nbsp;Экспорт в Excel</a>
                        </li>
                    </ul>
                </div>
                <!--<select id="searchType" class="span2 selectClass">-->
                    <!--&lt;!&ndash;<option value="1" selected="selected">Поиск по номеру партии</option>&ndash;&gt;-->
                    <!--<option value="0">Поиск по использованию кода</option>-->
                <!--</select>-->
                <!--<input id="searchParam" type="text" name="searchParam" class="span2 selectClass" >-->
                <!--<input type="button" id="query_btn" value="Поиск" class="btn btn-primary" onclick="search()">-->
                <!--<input type="button" id="excel_btn" value="Экспорт в Excel" class="btn btn-primary" onclick="exportExcel()">-->
            </form>
        </div>

        <!--<div class="col-sm-12 select-table table-striped" id="activeCodeListDiv">-->
            <!--<table id="activeCodeList"></table>-->
        <!--</div>-->

        <!--<div class="col-sm-12 select-table table-striped" style="display: none" id="activeCodeListPatchDiv">-->
            <!--<table id="activeCodeListPatch"></table>-->
        <!--</div>-->

        <div class="col-sm-12 select-table table-striped" style="display: block" id="activeCodeListCodeDiv">
            <table id="activeCodeListCode"></table>
        </div>
    </div>
</div>
<script th:inline="javascript">
    var prefix = ctx + "gmtool/operation";

    $(function() {
        var options = {
            url: prefix + "/queryActiveCodeByCode",
            id:"activeCodeListCode",
            modalName: "Журнал активационных кодов",
            showSearch: false,
            firstLoad:false,
            columns: [
                {
                    title: "№",
                    formatter: function (value, row, index) {
                        return $.table.serialNumber(index);
                    }
                },
                {
                    field: 'activeCode',
                    title: 'Активационный код'
                },
                {
                    field: 'platformName',
                    title: 'Платформа'
                },
                {
                    field: 'sid',
                    title: 'Сервер'
                },
                {
                    field: 'roleid',
                    title: 'ID персонажа'
                },
                {
                    field: 'userId',
                    title: 'ID аккаунта'
                },
                {
                    field: 'itemList',
                    title: 'Список предметов'
                },
                {
                    field: 'actionId',
                    title: 'Уникальный идентификатор'
                }]
        };
        $.table.init(options);
    });
</script>
</body>
</html>
