<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Библиотека меток событий')" />
    <th:block th:include="include :: footer" />

    <script>
        function reload() {
            $("input[name='id']").val("");
            $("input[name='name']").val("");
            $("input[name='icon']").val("");
            $("select[name='style']").eq(0).val(1);
        }

        // Редактирование
        function edit(id,name,icon,style) {
            $.modal.confirm("Изменить выбранную метку?", function () {
                $("input[name='id']").eq(0).val(id);
                $("input[name='name']").eq(0).val(name);
                $("input[name='icon']").eq(0).val(icon);
                $("select[name='style']").eq(0).val(style);
            });
        }

        // Отправка
        function submitConfig() {
            if (!$('#activity_form').validate().form()) {
                $.modal.msgError("Ошибка проверки");
                return;
            }

            var dataParam = $("#activity_form").serialize();

            $.ajax({
                url: prefix + "/checkTag",
                async:false,
                method: "post",
                dataType: "json",
                data: dataParam,

                success: function (data) {
                    if (data.ok) {

                        $.ajax({
                            url: prefix + "/addTag",
                            method: "post",
                            dataType: "json",
                            data: dataParam,

                            beforeSend: function () {
                                $.modal.loading("Обработка, подождите...");
                                $.modal.disable();
                            },

                            success: function (data) {
                                if (data.ok) {
                                    reload();
                                    $.table.refresh();
                                    $.modal.alertSuccess("Метка успешно добавлена в базу данных: " + data.msg);
                                    console.log(data);
                                } else {
                                    $.modal.alertError("Ошибка добавления метки");
                                }

                                $.modal.closeLoading();
                                $.modal.enable();
                            }
                        });

                    } else {

                        $.modal.confirm("Метка уже существует. Изменить её?", function () {

                            // Действие после подтверждения
                            $.ajax({
                                url: prefix + "/updateTag",
                                method: "post",
                                dataType: "json",
                                data: dataParam,

                                beforeSend: function () {
                                    $.modal.loading("Обработка, подождите...");
                                    $.modal.disable();
                                },

                                success: function (data) {
                                    if (data.ok) {
                                        reload();
                                        $.table.refresh();
                                        $.modal.alertSuccess("Метка успешно изменена в базе данных: " + data.msg);
                                        console.log(data);
                                    } else {
                                        alert("Ошибка изменения метки");
                                    }

                                    $.modal.closeLoading();
                                    $.modal.enable();
                                }
                            });
                        });
                    }
                }
            });
        }

        // Удаление
        function deleteConfig(id) {
            $.modal.confirm("Удалить выбранную метку?", function () {

                $.ajax({
                    url: prefix + "/deleteTag",
                    method: "post",
                    dataType: "json",
                    data: {"id": id},

                    beforeSend: function () {
                        $.modal.loading("Обработка, подождите...");
                        $.modal.disable();
                    },

                    success: function (data) {
                        if (data.ok) {
                            $.table.refresh();
                            $.modal.alertSuccess("Метка успешно удалена: " + data.msg);
                        } else {
                            $.modal.alertError("Не удалось удалить метку: " + data.msg);
                        }

                        $.modal.closeLoading();
                        $.modal.enable();
                    }
                });
            });
        }

    </script>
</head>

<body class="gray-bg">

<div class="container-div">
    <div class="row">

        <div class="col-sm-12 search-collapse">

            <form id="activity_form"
                  method="post"
                  class="main form-horizontal"
                  action="#">

                <div id="customForm">

                    <div class="col-lg-12 col-sm-12 col-md-12">

                        <div class="col-lg-1"></div>

                        <div class="col-lg-12">

                            <legend>Настройка библиотеки меток</legend>

                            <fieldset>

                                <div class="input-group" id="saltIpGroup">

                                    <label class="input-group-addon">
                                        Настройка метки:
                                    </label>

                                    <div name="cfg1"
                                         class="input-group saltIp"
                                         style="width:60%;padding:0 0 1px 0;">

                                        <label class="input-group-addon">
                                            ID метки:
                                        </label>

                                        <input type="text"
                                               class="form-control validate[required,custom[number]]"
                                               style="width:100px;"
                                               name="id"
                                               onkeyup="value=value.replace(/\D/g,'')">

                                        <label class="input-group-addon">
                                            Название метки:
                                        </label>

                                        <input type="text"
                                               class="form-control validate[required]"
                                               style="width:200px;"
                                               name="name">

                                        <label class="input-group-addon">
                                            Иконка метки:
                                        </label>

                                        <input type="text"
                                               class="form-control validate[required]"
                                               style="width:433px;"
                                               name="icon"
                                               onkeyup="value=value.replace(/\D/g,'')">

                                        <label class="input-group-addon">
                                            Стиль интерфейса:
                                        </label>

                                        <select id="style"
                                                name="style"
                                                style="width: 120px"
                                                class="form-control">

                                            <option value="1">Базовый</option>
                                            <option value="2">Рождество</option>
                                            <option value="3">Новый год</option>
                                            <option value="4">Китайский Новый год</option>
                                            <option value="5">День святого Валентина</option>
                                            <option value="6">Праздник воды</option>

                                        </select>

                                    </div>

                                </div>

                            </fieldset>

                        </div>

                    </div>

                </div>

            </form>


            <div class="col-md-12 col-sm-12 col-lg-12"
                 style="height: 30px"></div>

            <div class="col-sm-5 col-sm-5"></div>

            <div class="row-fluid col-sm-7 col-md-7">

                <input type="button"
                       value="Отправить"
                       onclick="submitConfig()"
                       class="btn btn-sm btn-danger"
                       style="margin-right: 30px"/>

            </div>

        </div>


        <div class="col-sm-12 select-table table-striped">

            <table id="bootstrap-table"></table>

        </div>

    </div>
</div>


<script th:inline="javascript">

    var prefix = ctx + "gmtool/activityConfig";

    $(function() {

        var options = {

            url: prefix + "/tagList",

            modalName: "Библиотека меток событий",

            columns: [

                {
                    field: 'id',
                    title: 'ID метки'
                },

                {
                    field: 'name',
                    title: 'Название метки'
                },

                {
                    field: 'icon',
                    title: 'Иконка метки'
                },

                {
                    field: 'style',
                    title: 'Стиль интерфейса',

                    formatter:function (value,row,index) {

                        if (value == 1){
                            return "Базовый";

                        } else if (value == 2){
                            return "Рождество";

                        } else if (value == 3){
                            return "Новый год";

                        } else if (value == 4){
                            return "Китайский Новый год";

                        } else if (value == 5){
                            return "День святого Валентина";

                        } else if (value == 6){
                            return "Праздник воды";
                        }
                    }
                },

                {
                    title: 'Действия',
                    align: 'center',

                    formatter: function(value, row, index) {

                        var actions = [];

                        actions.push(
                            '<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="edit(' +
                            row.id + ',\'' +
                            row.name + '\',\'' +
                            row.icon + '\',' +
                            row.style +
                            ')"><i class="fa fa-edit"></i>Редактировать</a> '
                        );

                        actions.push(
                            '<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="deleteConfig(\'' +
                            row.id +
                            '\')"><i class="fa fa-remove"></i>Удалить</a>'
                        );

                        return actions.join('');
                    }
                }
            ]
        };

        $.table.init(options);
    });

</script>

</body>
</html>
