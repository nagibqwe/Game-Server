<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Очки удачи розыгрыша')" />
    <th:block th:include="include :: footer" />

    <script>

        // Очистка данных
        function reload() {
            $("#idCopy").val("0");
            $("#totalLuckyValue").val("");
            $("#tips").val("");
        }

        // Отправка данных
        function submitConfig() {
            var idCopy=$("#idCopy").val();
            var totalLuckyValue=$("#totalLuckyValue").val();
            var tips=$("#tips").val();

            if (!$('#activity_form').validate().form()) {
                $.modal.msgError("Ошибка проверки");
                return;
            }

            $.ajax({
                url: prefix + "/addLuckyValue",
                method: "post",
                dataType: "json",
                data: {
                    "idCopy" : idCopy,
                    "totalLuckyValue" : totalLuckyValue,
                    "tips" : tips
                },
                success: function (data) {
                    if (data.ok) {
                        if($("#idCopy").val()>0){
                            $("#idCopy").val(0);
                            reload();
                            $.modal.alertSuccess("Событие успешно изменено");
                            $.table.refresh();
                        }else{
                            reload();
                            $.modal.alertSuccess("Событие успешно добавлено");
                            $.table.refresh();
                        }
                    } else {
                        $.modal.alertError("Не удалось добавить событие: " + data.msg);
                    }
                }
            });
        }

        // Публикация
        function publish(id,totalLuckyValue) {
            var requestUrl = $("#requestUrl").val();
            var ignoreMerge = $("#ignoreMerge").val();
            var modelName = "actLuckyValue";
            var url = 'requestUrl='+requestUrl+'&ignoreMerge='+ignoreMerge+'&modelName='+modelName;

            openServerList(url,function (index, layero) {
                $.modal.confirm("Перезаписать текущее активное событие?",function () {

                    // Действие после подтверждения
                    cover = 1;

                    var iframeWin = getIframeWin(layero);
                    var selections = selectionsSid(iframeWin);
                    var platform = getGroupName(iframeWin);

                    // console.log("aaaa:"+typeof (selections));

                    $.ajax({
                        url: prefix + "/publishActivity",
                        method: "post",
                        dataType: "json",
                        async:false,
                        data: {
                            "groupName": platform,
                            "serverids":selections.toString(),
                            "id":id,
                            "totalLuckyValue":totalLuckyValue,
                            "cover": cover
                        },
                        beforeSend: function () {
                            $.modal.loading("Обработка, подождите...");
                            $.modal.disable();
                        },
                        success: function (data) {
                            if (data.ok){
                                $("#msg").html("<span>" + data.msg + "</span>");
                                $.modal.alertMsg(data.msg,alert_type.INFO);
                            }else {
                                $("#msg").html("<span>" + data.msg + "</span>");
                                $.modal.alertMsg(data.msg,alert_type.FAIL);
                            }

                            $.table.refresh();
                            $.modal.closeLoading();
                            $.modal.enable();
                        }
                    });
                });
            });
        }

        // Редактирование данных
        function edit(id,totalLuckyValue,tips) {
            $("#idCopy").val(id);
            $("#totalLuckyValue").val(totalLuckyValue);
            $("#tips").val(tips);
        }

        // Удаление
        function deleteConfig(id) {
            $.modal.confirm("Удалить запись?", function () {
                $.ajax({
                    url: prefix + "/deleteLuckyValue",
                    method: "post",
                    dataType: "json",
                    data: {"id": id},
                    success: function (data) {
                        if (data.ok) {
                            $.modal.alertSuccess("Событие успешно удалено");
                            $.table.refresh();
                        } else {
                            $.modal.alertError("Не удалось удалить событие");
                        }
                    }
                });
            });
        }
    </script>
</head>

<body class="gray-bg">

<div class="container-div">
    <div class="row">

        <div class="col-sm-12 search-collapse">

            <form id="activity_form" method="post" class="form-horizontal" action="#">
                <div id="customForm">

                    <div class="col-lg-12 col-sm-12 col-md-12">

                        <div class="col-lg-1"></div>

                        <div class="col-lg-11">

                            <legend>Настройка общего значения удачи</legend>

                            <fieldset>

                                <div class="input-group" id="Luckyshuju">

                                    <label class="input-group-addon">
                                        Общее значение удачи:
                                    </label>

                                    <div class="col-md-2 col-sm-2 col-xs-2">

                                        <input type="text"
                                               class="form-control"
                                               id="totalLuckyValue"
                                               name="totalLuckyValue"
                                               placeholder="Пример: 50"
                                               onkeyup="value=value.replace(/\D/g,'')"
                                               value=""
                                               required/>

                                    </div>
                                </div>

                                <div class="input-group"
                                     id="tipshuju"
                                     style="margin-top: 10px">

                                    <label class="input-group-addon">
                                        Примечание:
                                    </label>

                                    <div class="col-md-2 col-sm-2 col-xs-2"
                                         style="margin-left: 28px">

                                        <input type="text"
                                               class="form-control"
                                               id="tips"
                                               name="tips"
                                               value=""/>

                                        <input type="hidden"
                                               id="idCopy"
                                               value="0">

                                    </div>
                                </div>

                                <!-- Настройка адреса группы серверов для отправки запроса -->
                                <input type="hidden"
                                       id="requestUrl"
                                       value="gameServer">

                                <input type="hidden"
                                       id="ignoreMerge"
                                       value="1">

                            </fieldset>

                        </div>
                    </div>

                </div>
            </form>

            <div class="col-md-12 col-sm-12 col-lg-12"
                 style="height: 30px"></div>

            <div class="col-sm-5 col-sm-5"></div>

            <div class="row-fluid col-sm-7 col-md-7">

                <input type="button"
                       value="Отправить"
                       onclick="submitConfig()"
                       class="btn btn-sm btn-danger"
                       style="margin-right: 30px"/>

            </div>

        </div>


        <div class="col-sm-12 select-table table-striped">

            <table id="bootstrap-table"></table>

            <div id="msg" class="container-fluid"></div>

        </div>

    </div>
</div>


<script th:inline="javascript">

    var prefix = ctx + "gmtool/activityConfig";

    $(function() {

        var options = {

            url: prefix + "/luckyValueList",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",

            modalName: "Очки удачи розыгрыша",

            columns: [

                {
                    field: 'id',
                    title: 'ID события'
                },

                {
                    field: 'totalLuckyValue',
                    title: 'Общее значение удачи'
                },

                {
                    field: 'tips',
                    title: 'Примечание'
                },

                {
                    field: 'state',
                    title: 'Статус события',

                    formatter:function (value) {

                        if (value == 0){
                            return "Отправлено, ожидает публикации";
                        }else if (value == 3){
                            return "Опубликовано";
                        }else {
                            return "Ошибка";
                        }
                    }
                },

                {
                    field: 'toSidList',
                    title: 'Список серверов для публикации'
                },

                {
                    field: 'okSidList',
                    title: 'Успешно опубликовано'
                },

                {
                    title: 'Действия',
                    align: 'center',

                    formatter: function(value, row, index) {

                        var actions = [];

                        actions.push(
                            '<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="publish(\'' +
                            row.id + '\',' + row.totalLuckyValue +
                            ')"><i class="fa fa-bookmark"></i>Опубликовать</a> '
                        );

                        actions.push(
                            '<a class="btn btn-warning btn-xs" href="javascript:void(0)" onclick="edit(\'' +
                            row.id + '\',' + row.totalLuckyValue + ',\'' + row.tips +
                            '\')"><i class="fa fa-edit"></i>Редактировать</a>'
                        );

                        actions.push(
                            '<a class="btn btn-danger btn-xs" style="margin-left: 4px" href="javascript:void(0)" onclick="deleteConfig(\'' +
                            row.id +
                            '\')"><i class="fa fa-remove"></i>Удалить</a>'
                        );

                        return actions.join('');
                    }
                }
            ]
        };

        $.table.init(options);
    });

</script>

</body>
</html>
