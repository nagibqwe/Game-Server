<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Бросок кубика')" />
    <th:block th:include="include :: footer" />

    <script>

        var actType = [[${type}]];
        var count_01 = 0;
        var count_02 = 0;
        var count_03 = 0;
        var count_06 = 0;
        var count_07 = 0;
        $(function () {
            getActivityType(actType);
            addHeightSet();
            load(actType);
        });

    </script>

    <script>
        function addGridCfg(obj,num) {
            for (var i=0;i<num+1;i++){
                if (i<num){
                    addGridCfgSingle(obj);
                }else {
                    $("#addSingleCfgBtn").attr("disabled", true);// Сделать недоступным
                    $("#addSingleCfgBtn").style.backgroundColor="#555555";
                }
            }
        }

        function addGridCfgSingle(obj) {
            var count = $("#gridCount").val();
            count=Number(count)+1;
            $("#gridCount").val(count);
            var rewardInput = 'grids' + count
            var rewardAddBtn = 'showAddItemModel' + count
            var html = '<div name="cfg5" class="input-group saltIp" style="">' +
                '<label class="input-group-addon">Ячейка: '+count+'</label>' +
                // '<input type="text" class="form-control" id="p_round" name="p_round" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Награда:</label>' +
                // '<input type="text" class="form-control" id="g_reward" name="g_reward" style="max-width:auto;">' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Добавить награду" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="grids"/></div>' +
                '</span>' +
                // '<span class="input-group-btn">' +
                // '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" id="delGridGroup">' +
                // '<span class="glyphicon glyphicon-minus"></span>' +
                '</button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
    </script>

    <script>
        function addBigGridCfg(obj) {
            var rewardInput = 'bigGiftReward' + count_03;
            var rewardAddBtn = 'showRewardModel3' + count_03;
            count_03 += 1;
            var html = '<div name="cfg2" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">Вес набора:</label>' +
                '<input type="text" class="form-control" name="bigGiftWeight" onkeyup="value=value.replace(/\\D/g,\'\')" style="">' +
                '<label class="input-group-addon">Группа наград:</label>'+
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Группа наград" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="bigGiftReward"/></div>' +
                '</span>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'

            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>
    <script>
        function addPlayerCfg(obj) {
            var rewardInput = 'playerTimes' + count_01;
            var rewardAddBtn = 'showRewardModel' + count_01;
            count_01 += 1;
            var html = '<div name="cfg3" class="input-group saltIp" style="">' +
                '<label class="input-group-addon">Личный прогресс:</label>' +
                '<input type="text" class="form-control" name="playerProc" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Награда:</label>' +
                // '<input type="text" class="form-control" name="playerTimes" style="max-width:auto;" placeholder="Пример: 3_1_1_9;1017_1_1_9">' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="playerTimes"/></div>' +
                '</span>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delExChangeConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delExChangeConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        function addServerCfg(obj) {
            var rewardInput = 'serverTimes' + count_02;
            var rewardAddBtn = 'showRewardModel2' + count_02;
            count_02 += 1;
            var html = '<div name="cfg4" class="input-group saltIp" style="">' +
                '<label class="input-group-addon">Прогресс на всех серверах:</label>' +
                '<input type="text" class="form-control" name="serverProc" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Награда:</label>' +
                // '<input type="text" class="form-control" name="serverTimes" style="max-width:auto;" placeholder="Пример: 3_1_1_9;1017_1_1_9">' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="serverTimes"/></div>' +
                '</span>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        $(document).on('click', '#copyGridGroup', function () {
            var el = this.parentNode.parentNode;
            var newEl = el.cloneNode(true);
            el.parentNode.insertBefore(newEl, el);
        })
        $(document).on('click', '#delGridGroup', function () {
            var el = this.parentNode.parentNode
            var saltIp = $(this).parent().parent().find('#saltIp').val()
            el.parentNode.removeChild(el)

            var count = $("#gridCount").val();
            if(count>0){
                count=Number(count)-1;
                $("#gridCount").val(count);
            }
            return;
        })
    </script>

    <script>
        function validate() {
            return true;
        }
    </script>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <div id="header">
                <h3>Бросок кубика<span class="glyphicon glyphicon-question-sign" title="Описание конфигурации события"
                              data-container="body" data-toggle="popover" data-placement="right"
                              data-content="При настройке события название события поддерживает многоязычное отображение. Используйте следующий синтаксис: [CH]Китайский (упрощ.)[/CH][EN]Английский[/EN][TW]Китайский (трад.)[/TW][KR]Корейский[/KR][VIE]Вьетнамский[/VIE][TH]Тайский[/TH][JP]Японский[/JP]"></span></h3>
            </div>
            <form id="activity_form" method="post" class="form-horizontal" action="#">
                <div th:replace="common/BaseActivity_header.html"></div>

                <div id="customForm">
                    <div id="costGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация затрат</legend>
                            <fieldset>
                                <div name="config" class="input-group saltIp">
                                    <label class="input-group-addon">Золотых слитков за один бросок:</label>
                                    <input name="costGold" id="costGold" value="" title="Золотых слитков за один бросок" placeholder="Пример: 100"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Затраты на кубик:</label>
                                    <!--<input name="cost" id="cost" value="" title="Затраты на кубик" type="text" class=" form-control" placeholder="Пример: 60020_1_1_9"/>-->
                                    <span class="input-group-btn">
                            <button class="btn btn-info" type="button" data-toggle="tooltip" title="Затраты на кубик" id="addCostBtn"
                                    onclick="showAddItemUI('cost','addCostBtn')"><span class="glyphicon glyphicon-plus"></span></button>
                            <input type="hidden" id="cfgCount1" value="0">
                        </span>
                                    <input name="cost" id="cost" value="" type="text" class=" hide"/>
                                    <label class="input-group-addon">Получение кубиков в полночь:</label>
                                    <!--<input name="dailyGain" id="dailyGain" value="" title="Получение кубиков в полночь" type="text" class=" form-control" placeholder="Пример: 60020_3_1_9" />-->
                                    <span class="input-group-btn">
                            <button class="btn btn-info" type="button" data-toggle="tooltip" title="Получение кубиков в полночь" id="addDailyGainBtn"
                                    onclick="showAddItemUI('dailyGain','addDailyGainBtn')"><span class="glyphicon glyphicon-plus"></span></button>
                            <input type="hidden" id="cfgCount2" value="0">
                        </span>
                                    <input name="dailyGain" id="dailyGain" value="" type="text" class=" hide"/>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="gridGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Награды за ячейки</legend>
                            <fieldset>
                                <div class="input-group" id="singlePrcCfg">
                                    <label class="input-group-addon">Конфигурация наград:</label>
                                    <input id="gridCount" type="hidden" value="">
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="addSingleCfgBtn"
                                            onclick="addGridCfg(this,40)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="bigGridGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Награды за главный приз</legend>
                            <fieldset>
                                <div class="input-group" id="bigSinglePrcCfg">
                                    <label class="input-group-addon">Конфигурация наград:</label>
                                    <input id="bigGridCount" type="hidden" value="">
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="addBigSingleCfgBtn"
                                            onclick="addBigGridCfg(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="playerGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Награды за личный прогресс</legend>
                            <fieldset>
                                <div class="input-group" id="serverPrcCfg">
                                    <label class="input-group-addon">Конфигурация наград:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="playerGroupBtn"
                                            onclick="addPlayerCfg(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="serverGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Награды за прогресс на всех серверах</legend>
                            <fieldset>
                                <div class="input-group" id="jianglishuju">
                                    <label class="input-group-addon">Конфигурация наград:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="addServerCfgBtn"
                                            onclick="addServerCfg(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                    <div id="luckyGroup" class="col-lg-3 col-sm-3 col-md-3" style="margin-left: 100px">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Настройка удачи</legend>
                            <fieldset>
                                <div class="input-group saltIp">
                                    <label class="input-group-addon">Удача за одно участие:</label>
                                    <input name="oneLuckyValue" id="oneLuckyValue"
                                           type="text" class=" form-control" style="width:100px;" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Список наград:</label>
                                    <span class="input-group-btn">
                            <button class="btn btn-info" type="button" data-toggle="tooltip" title="Список наград" id="addOneLuckyBtn"
                                    onclick="showAddItemUI('luckyAwardGift','addOneLuckyBtn')"><span class="glyphicon glyphicon-plus"></span></button>
                            <input type="hidden" id="cfgCount5" value="0">
                        </span>
                                    <input name="luckyAwardGift" id="luckyAwardGift" value="" type="text" class=" hide"/>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="baodiPool" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация гарантированных попыток</legend>
                            <fieldset>
                                <div class="input-group" id="baodishuju">
                                    <label class="input-group-addon">Гарантированные попытки:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="baoDiBtn"
                                            onclick="baoDiGrp(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </form>

            <div th:replace="common/import.html"></div>
        </div>

        <div th:replace="common/BaseActivity_footer.html"></div>

        <div th:replace="common/itemAddModel.html"></div>
    </div>
</div>
</body>
</html>
