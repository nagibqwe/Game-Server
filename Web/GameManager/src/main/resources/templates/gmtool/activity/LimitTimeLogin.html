<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Ежедневный вход')" />
    <th:block th:include="include :: footer" />

    <script>

        var actType = [[${type}]];
        var count_01 = 0;
        $(function () {
            getActivityType(actType);

            load(actType);
        });

    </script>

    <script>
        function addSaltIpGrp(obj) {
            console.log(count_01);
            var rewardInput = 'i_RewardGroup' + count_01;
            var rewardAddBtn = 'showRewardModel' + count_01;
            var buyRewardInput = 'i_BuyRewardGroup' + count_01;
            var buyRewardAddBtn = 'showBuyRewardModel' + count_01;
            count_01 += 1;
            html = '<div name="cfg1" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">День:</label>' +
                '<input type="text" class="form-control" id="i_day" name="i_day" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:200px;">' +
                '<label class="input-group-addon">Базовая группа наград:</label>' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Базовая группа наград" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="i_RewardGroup"/></div>' +
                '</span>' +
                // '<input type="text" class="form-control" id="i_RewardGroup" name="i_RewardGroup"  style="max-width:auto;">' +
                '<label class="input-group-addon">Расширенная группа наград:</label>' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Расширенная группа наград" id="' + buyRewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + buyRewardInput + ',' + buyRewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + buyRewardInput + '" name="i_BuyRewardGroup"/></div>' +
                '</span>' +
                // '<input type="text" class="form-control" id="i_BuyRewardGroup" name="i_BuyRewardGroup"  style="max-width:auto;">' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delExChangeConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delExChangeConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        function validate() {
            return true;
        }
    </script>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <div id="header">
                <h3>Ежедневный вход<span class="glyphicon glyphicon-question-sign" title="Описание конфигурации события"
                              data-container="body" data-toggle="popover" data-placement="right"
                              data-content="Расширенная валюта: тип валюты для разблокировки премиум-входа, укажите необходимое количество<br/>
                                День: не повторяется, но должен быть меньше или равен длительности события<br/>
                                Базовая группа наград: бесплатная награда за вход в этот день<br/>
                                Расширенная группа наград: награда после разблокировки премиум-входа, может быть пустой — означает отсутствие награды за этот день"></span></h3>
            </div>
            <form id="activity_form" method="post" class="form-horizontal" action="#">
                <div th:replace="common/BaseActivity_header.html"></div>

                <div id="customForm">
                    <div id="costGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация расширенного входа</legend>
                            <fieldset>
                                <div class="input-group">
                                    <label class="input-group-addon">Расширенная валюта:</label>
                                    <div class="col-md-3 col-sm-3 col-xs-3">
                                        <select id="coinType" name="coinType" onchange="" class="form-control">
                                            <option value="1">Золотые слитки</option>
                                            <option value="3">Монеты</option>
                                            <option value="12">Серебряные слитки</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 col-sm-3 col-xs-3">
                                        <input type="text" class="form-control" id="coinCount" name="coinCount"
                                               placeholder="800" onkeyup="value=value.replace(/\D/g,'')"
                                               required/>
                                    </div>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                    <div class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация ежедневного входа</legend>
                            <fieldset>
                                <div class="input-group" id="saltIpGroup">
                                    <label class="input-group-addon">Список конфигураций:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="addSaltIpGrpBtn"
                                            onclick="addSaltIpGrp(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                    <input type="hidden" id="cfgCount1" value="0">
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </form>

            <div th:replace="common/import.html"></div>
        </div>

        <div th:replace="common/BaseActivity_footer.html"></div>

        <div th:replace="common/itemAddModel.html"></div>
    </div>
</div>
</body>
</html>
