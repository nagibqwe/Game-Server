<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Сокровищница Небесного Императора')" />
    <th:block th:include="include :: footer" />

    <script>

        var actType = [[${type}]];
        var changeStyle = false;
        var count_01 = 0;
        var count_02 = 0;
        var count_03 = 0;
        var count_04 = 0;
        var count_06 = 0;
        var count_07 = 0;
        $(function () {
            getActivityType(actType);
            addHeightSet();
            load(actType);
        });

        function changeStyleClass() {
            if (!changeStyle) {
                $("#singleGroup").removeClass("col-lg-3 col-sm-3 col-md-3").addClass("col-lg-6 col-sm-6 col-md-6");
                $("#serverGroup").removeClass("col-lg-3 col-sm-3 col-md-3").addClass("col-lg-6 col-sm-6 col-md-6");
                $("#rewardPool").removeClass("col-lg-3 col-sm-3 col-md-3").addClass("col-lg-6 col-sm-6 col-md-6");
                $("#costGroup").removeClass("col-lg-3 col-sm-3 col-md-3").addClass("col-lg-6 col-sm-6 col-md-6");
                changeStyle = true;
            }
        }
    </script>

    <script>
        function addSingleCfg(obj) {
            changeStyleClass();
            console.log(count_01);
            var rewardInput = 'p_reward' + count_01;
            var rewardAddBtn = 'showRewardModel' + count_01;
            count_01 += 1;
            html = '<div name="cfg1" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">Раунд:</label>' +
                '<input type="text" class="form-control" id="p_round" name="p_round" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Награда:</label>' +
                // '<input type="text" class="form-control" id="p_reward" name="p_reward" style="max-width:auto;">' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="p_reward"/></div>' +
                '</span>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delExChangeConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delExChangeConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>
    <script>
        function addServerCfg(obj) {
            changeStyleClass();
            var rewardInput = 'g_reward' + count_02;
            var rewardAddBtn = 'showRewardModel2' + count_02;
            count_02 += 1;
            html = '<div name="cfg2" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">Прогресс на всех серверах:</label>' +
                '<input type="text" class="form-control" id="g_s_reach" name="g_s_reach" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Личный прогресс:</label>' +
                '<input type="text" class="form-control" id="g_p_reach" name="g_p_reach" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Награда:</label>' +
                // '<input type="text" class="form-control" id="g_reward" name="g_reward" style="max-width:auto;">' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="g_reward"/></div>' +
                '</span>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        function jiangliGrp(obj) {
            changeStyleClass();
            var rewardInput = 'i_reward' + count_03;
            var rewardAddBtn = 'showRewardModel3' + count_03;
            count_03 += 1;
            html = '<div name="cfg3" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">Вес награды:</label>' +
                '<input type="text" class="form-control" id="i_weight" name="i_weight" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Главный приз:</label>' +
                '<select id="i_big" name="i_big" onchange="" class="form-control heightSet" style="min-width:40px;width: 61px;">' +
                '<option value="0">Нет</option>' +
                '<option value="1">Да</option>' +
                '</select>' +
                '<label class="input-group-addon">Награда:</label>' +
                // '<input type="text" class="form-control" id="i_reward" name="i_reward" style="max-width:auto;">' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="i_reward"/></div>' +
                '</span>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delConfig3(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                // '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Копировать" id="copyGridGroup"><span class="glyphicon glyphicon-copy"></span></button>' +
                '</span>' +
                '</div>';
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        function delConfig3(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        $(document).on('click', '#copyGridGroup', function () {
            var el = this.parentNode.parentNode;
            var newEl = el.cloneNode(true);
            el.parentNode.insertBefore(newEl, el);
        });
        $(document).on('click', '#delGridGroup', function () {
            var el = this.parentNode.parentNode;
            var saltIp = $(this).parent().parent().find('#saltIp').val();
            el.parentNode.removeChild(el);
            return;
            // if (saltIp == ""){
            //     el.parentNode.removeChild(el)
            //     return
            // }
            // alertify.confirm('Вы уверены, что хотите удалить выбранную команду?',
            //     function (e) {
            //         el.parentNode.removeChild(el)
            //         return
            //     }
            //     )

        })
    </script>

    <script>
        function validate() {
            if (checkBaodi() && checkBaoDiRange() && checkBaoDiRangeInfo()){
                return true;
            }else {
                return false;
            }
        }
    </script>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <div id="header">
                <h3>Сокровищница Небесного Императора<span class="glyphicon glyphicon-question-sign" title="Описание конфигурации события"
                              data-container="body" data-toggle="popover" data-placement="right"
                              data-content="【Предметы для розыгрыша】<br/>
                                Коэффициент главного приза: главный приз может быть выигран только после N попыток<br/>
                                Предмет для розыгрыша: ID предмета, используемого для розыгрыша (1 предмет = 1 попытка, 10 предметов = 10 попыток)<br/>
                                Золотые слитки для розыгрыша: количество духовных нефритов, необходимое для розыгрыша (добавляется бонусный предмет, по умолчанию монеты × 10000)<br/>
                                【Награды за личные раунды】<br/>
                                Раунд: возрастающее целое число, по достижении указанного раунда выдаётся награда (1 главный приз = 1 раунд)<br/>
                                【Награды за прогресс на всех серверах】<br/>
                                Количество попыток на всех серверах достигает X и личный прогресс достигает Y → можно получить награду<br/>
                                【Конфигурация пула наград】<br/>
                                Вес награды: вероятность выпадения предмета (после выпадения предмета он не выпадает снова в этом раунде)<br/>
                                Главный приз: если выпадает главный приз, игрок переходит на следующий раунд, все карты сбрасываются<br/>
                                Награда: соответствующие предметы, для разных классов нужно настраивать отдельные предметы<br/>
                                【Настройка удачи】<br/>
                                Удача за одно участие: удача за одну попытку (обычно равна количеству духовных нефритов за попытку)<br/>
                                Список наград: обычно соответствует главному призу в этом розыгрыше"></span></h3>
            </div>
            <form id="activity_form" method="post" class="form-horizontal" action="#">
                <div th:replace="common/BaseActivity_header.html"></div>

                <div id="customForm">
                    <div id="costGroup" class="col-lg-3 col-sm-3 col-md-3">
                        <!--<div class="col-lg-1"></div>-->
                        <div class="col-lg-12">
                            <legend>Предметы для розыгрыша</legend>
                            <fieldset>
                                <div class="input-group saltIp">
                                    <label class="input-group-addon">Коэффициент главного приза:</label>
                                    <input name="i_big_limit" id="i_big_limit" value="" title="Коэффициент главного приза" placeholder="Главный приз открывается после N попыток"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Предмет для розыгрыша:</label>
                                    <input name="i_costItem" id="i_costItem" value="1061" title="Предмет для розыгрыша"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Золотые слитки для розыгрыша:</label>
                                    <input name="i_costGold" id="i_costGold" value="50" title="Золотые слитки для розыгрыша"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <span class="input-group-btn">
                            <button class="btn btn-info" type="button" data-toggle="tooltip" title="Бонусный предмет за попытку" id="addGoldGiftBtn"
                                    onclick="showAddItemUI('i_GoldGift','addGoldGiftBtn')"><span class="glyphicon glyphicon-plus"></span></button>
                            <input type="hidden" id="cfgCount1" value="0">
                        </span>
                                    <input name="i_GoldGift" id="i_GoldGift" value="" type="text" class=" hide"/>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                    <div id="singleGroup" class="col-lg-3 col-sm-3 col-md-3">
                        <!--<div class="col-lg-1"></div>-->
                        <div class="col-lg-12">
                            <legend>Награды за личные раунды</legend>
                            <fieldset>
                                <div class="input-group" id="singlePrcCfg">
                                    <label class="input-group-addon">Конфигурация прогресса:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="addSingleCfgBtn"
                                            onclick="addSingleCfg(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                    <input type="hidden" id="cfgCount2" value="0">
                                </div>
                            </fieldset>
                        </div>
                    </div>
                    <div id="serverGroup" class="col-lg-3 col-sm-3 col-md-3">
                        <!--<div class="col-lg-1"></div>-->
                        <div class="col-lg-12">
                            <legend>Награды за прогресс на всех серверах</legend>
                            <fieldset>
                                <div class="input-group" id="serverPrcCfg">
                                    <label class="input-group-addon">Конфигурация прогресса:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="addServerCfgBtn"
                                            onclick="addServerCfg(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                    <input type="hidden" id="cfgCount3" value="0">
                                </div>
                            </fieldset>
                        </div>
                    </div>
                    <div id="rewardPool" class="col-lg-3 col-sm-3 col-md-3">
                        <!--<div class="col-lg-1"></div>-->
                        <div class="col-lg-12">
                            <legend>Конфигурация пула наград</legend>
                            <fieldset>
                                <div class="input-group" id="jianglishuju">
                                    <label class="input-group-addon">Данные пула наград:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="jiangliBtn"
                                            onclick="jiangliGrp(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                    <input type="hidden" id="cfgCount4" value="0">
                                </div>
                            </fieldset>
                        </div>
                    </div>
                    <div id="luckyGroup" class="col-lg-3 col-sm-3 col-md-3">
                        <!--<div class="col-lg-1"></div>-->
                        <div class="col-lg-12">
                            <legend>Настройка удачи</legend>
                            <fieldset>
                                <div class="input-group saltIp">
                                    <label class="input-group-addon">Удача за одно участие:</label>
                                    <input name="oneLuckyValue" id="oneLuckyValue"
                                           type="text" class=" form-control" style="width:100px;" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Список наград:</label>
                                    <span class="input-group-btn">
                            <button class="btn btn-info" type="button" data-toggle="tooltip" title="Список наград" id="addOneLuckyBtn"
                                    onclick="showAddItemUI('luckyAwardGift','addOneLuckyBtn')"><span class="glyphicon glyphicon-plus"></span></button>
                            <input type="hidden" id="cfgCount5" value="0">
                        </span>
                                    <input name="luckyAwardGift" id="luckyAwardGift" value="" type="text" class=" hide"/>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="baodiPool" class="col-lg-12 col-sm-12 col-md-12">
                        <!--<div class="col-lg-1"></div>-->
                        <div class="col-lg-11">
                            <legend>Конфигурация гарантированных попыток</legend>
                            <fieldset>
                                <div class="input-group" id="baodishuju">
                                    <label class="input-group-addon">Гарантированные попытки:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="baoDiBtn"
                                            onclick="baoDiGrp(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </form>

            <div th:replace="common/import.html"></div>
        </div>

        <div th:replace="common/BaseActivity_footer.html"></div>

        <div th:replace="common/itemAddModel.html"></div>
    </div>
</div>
</body>
</html>
