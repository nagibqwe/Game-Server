    <script>

        var actType = [[${type}]];
        $(function () {
            getActivityType(actType);
            addHeightSet();

        function changeStyleClass() {
            $("#ratePool").removeClass("col-lg-4 col-sm-4 col-md-4").addClass("col-lg-6 col-sm-6 col-md-6");
            $("#gearPool").removeClass("col-lg-9 col-sm-9 col-md-9").addClass("col-lg-9 col-sm-9 col-md-9");
        }
    </script>

    <script>
        function jiangliGrp(obj) {
            changeStyleClass();

                '<label class="input-group-addon">Множитель награды:</label>' +
                '<input type="text" class="form-control" id="i_weight" name="i_rate" placeholder="Пример: 120" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:auto;">' +

        }

                '<input type="text" class="form-control" id="recharge" name="recharge" placeholder="Пример: 100 (в минимальных единицах)" onkeyup="value=value.replace(/\\D/g,\'\')" class="input-xlarge" style="max-width:110px;" required/>' +
                '<label class="input-group-addon">Минимальный номер награды:</label>' +
                '<select id="minIndex" name="minIndex" onchange="" class="form-control heightSet" style="min-width:100px;width: 101px;">' +
                '<option value="0">Награда 1</option>' +
                '<option value="1">Награда 2</option>' +
                '<option value="2">Награда 3</option>' +
                '<option value="3">Награда 4</option>' +
                '<option value="4">Награда 5</option>' +
                '<option value="5">Награда 6</option>' +
                '<option value="6">Награда 7</option>' +
                '<option value="7">Награда 8</option>' +
                '</select>' +
                '<label class="input-group-addon">Максимальный номер награды:</label>' +
                '<select id="maxIndex" name="maxIndex" onchange="" class="form-control heightSet" style="min-width:100px;width: 101px;">' +
                '<option value="0">Награда 1</option>' +
                '<option value="1">Награда 2</option>' +
                '<option value="2">Награда 3</option>' +
                '<option value="3">Награда 4</option>' +
                '<option value="4">Награда 5</option>' +
                '<option value="5">Награда 6</option>' +
                '<option value="6">Награда 7</option>' +
                '<option value="7">Награда 8</option>' +
                '</select>' +
                // '<label class="input-group-addon">Минимальный пул наград:</label>' +
                // '<input type="text" class="form-control" id="minIndex" name="minIndex" placeholder="Пример: 0" onkeyup="value=value.replace(/\\D/g,\'\')" class="input-xlarge" style="max-width:60px;" required/>' +
                '<label class="input-group-addon">Осталось попыток на всём сервере:</label>' +
                '<input type="text" class="form-control" id="serverRestNum" name="serverRestNum" placeholder="Пример: 7" onkeyup="value=value.replace(/\\D/g,\'\')" class="input-xlarge" style="max-width:60px;" required/>' +

                // '<input type="text" class="form-control" id="p_reward" name="p_reward" style="max-width:auto;">' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" id="delGridGroup"><span class="glyphicon glyphicon-minus"></span></button>' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Копировать" id="copyGridGroup"><span class="glyphicon glyphicon-copy"></span></button>' +
                '</span>' +
                '</div>';

            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
    </script>

    <script>
        $(document).on('click', '#copyGridGroup', function () {
            var el = this.parentNode.parentNode;
            var newEl = el.cloneNode(true);
            el.parentNode.insertBefore(newEl, el);
        });

        $(document).on('click', '#delGridGroup', function () {
            var el = this.parentNode.parentNode;
            var saltIp = $(this).parent().parent().find('#saltIp').val();
            el.parentNode.removeChild(el);
            return;
        });
    </script>

    <script>
        function validate() {
            return true;
        }
    </script>
