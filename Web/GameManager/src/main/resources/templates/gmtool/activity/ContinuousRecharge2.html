        var actType = [[${type}]];

    <script>
        function addSaltIpGrp(obj){
            console.log(count_01);
            var fixRewardInput = 'i_fixRewardGroup' + count_01;
            var fixRewardAddBtn = 'showFixRewardModel' + count_01;
            var totalRewardInput = 'i_totalRewardGroup' + count_01;
            var totalRewardAddBtn = 'showTotalRewardModel' + count_01;
            count_01 += 1;
            var html = '<div name="cfg" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">'+
                '<label class="input-group-addon">Количество дней пополнения:</label>'+
                '<input type="text" class="form-control" name="i_day" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:auto;">'+
                '<label class="input-group-addon">Фиксированная группа наград:</label>'+
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Фиксированная группа наград" id="' + fixRewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + fixRewardInput + ',' + fixRewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + fixRewardInput + '" name="i_fixRewardGroup"/></div>' +
                '</span>' +
                // '<input type="text" class="form-control" name="i_fixRewardGroup" style="max-width:auto;">'+
                '<label class="input-group-addon">Накопительная группа наград:</label>'+
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Накопительная группа наград" id="' + totalRewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + totalRewardInput + ',' + totalRewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + totalRewardInput + '" name="i_totalRewardGroup"/></div>' +
                '</span>' +
                // '<input type="text" class="form-control" name="i_totalRewardGroup" style="max-width:auto;">'+
                '<span class="input-group-btn">'+
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delExChangeConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>'+
                '</span>'+
                '</div>'
            obj.insertAdjacentHTML('beforeBegin',html);
            addHeightSet();

            var dayCount = $(obj).parent().parent().find("input[name='dayCount']").val();
            $(obj).parent().parent().find("input[name='dayCount']").val(dayCount*1+1);// Счётчик дней пополнения в каждой конфигурации
        }
        // Удаление конфигурации
        function delExChangeConfig(obj) {
            var dayCount = $(obj).parent().parent().parent().find("input[name='dayCount']").val();
            $(obj).parent().parent().parent().find("input[name='dayCount']").val(dayCount*1-1);// Счётчик дней пополнения в каждой конфигурации
            $(obj).parent().parent().remove();
        }
    </script>
