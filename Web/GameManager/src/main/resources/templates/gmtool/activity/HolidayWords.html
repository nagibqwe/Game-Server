<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Праздничный сбор символов')" />
    <th:block th:include="include :: footer" />

    <script>

        var actType = [[${type}]];
        var count_01 = 0;
        var count_02 = 0;
        var count_03 = 0;
        // Данные о боссах
        var bossData;

        $(function () {
            getActivityType(actType);
            addHeightSet();
            load(actType);
            loadActivityBossType();
        });

    </script>
    <script>
        /**
         * Загрузка информации о боссах
         */
        function loadActivityBossType() {
            $.ajax({
                url: prefix + "/getActivityBossType",
                method: "post",
                dataType: "json",
                success: function (data) {
                    if (!data.ok) {
                        $.modal.alertError("Ошибка загрузки данных о боссах");
                        return;
                    }
                    bossData = data.data;
                    console.log("Боссы загружены успешно!!");
                }
            });
        }
    </script>

    <script>
        function addSaltIpGrp(obj) {
            html = '<div class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">Расходуемая валюта:</label>' +
                '<input type="text" class="form-control"  name="coinType" onkeyup="value=value.replace(/\\D/g,\'\')" style="">' +
                '<label class="input-group-addon">Активность за обмен:</label>' +
                '<input type="text" class="form-control"  name="coinCv" onkeyup="value=value.replace(/\\D/g,\'\')" style="">' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" id="delGridGroup"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
    </script>

    <script>
        function jiangliGrp_01(obj,prefix,postfix) {
            console.log(count_01)
            var wordsRewardInput = 'words' + count_01
            var wordsRewardAddBtn = 'showAddWordsModel' + count_01
            count_01 += 1;
            html = '<div name="cfg2" class="input-group saltIp" style="width:100%;padding:0 0 1px 0; margin-left:fill  ">' +
                '<label class="input-group-addon">Награда за выпадение:</label>' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Добавить предмет для выпадения" id="' + wordsRewardAddBtn +'"  style="border:5px;width: 35px;height: 34px;" ' +
                'onclick="showAddItemUI(' + wordsRewardInput + ',' + wordsRewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + wordsRewardInput + '" type="text" name="'+prefix+'dropRewardItems'+postfix+'"/></div>' +
                '</span>' +
                '<label class="input-group-addon">Вес выпадения:</label>' +
                '<input type="text" class="form-control"  name="'+prefix+'dropWeight'+postfix+'" id="'+prefix+'dropWeight" onkeyup="value=value.replace(/\\D/g,\'\')" placeholder="Вес выпадения" >' +

                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delReward(this,\''+prefix+'\')"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
            if (prefix == "clone_") {
                var count = $(obj).parent().find("input[name='dropCloneReward']").val();
                $(obj).parent().find("input[name='dropCloneReward']").val(count*1+1);
            } else {
                var count = $(obj).parent().find("input[name='dropBossReward']").val();
                $(obj).parent().find("input[name='dropBossReward']").val(count*1+1);
            }
        }
        // Удаление конфигурации награды
        function delReward(obj,prefix) {
            if (prefix == "clone_"){
                var count = $(obj).parent().parent().parent().find("input[name='dropCloneReward']").val();
                if(count>0){
                    $(obj).parent().parent().parent().find("input[name='dropCloneReward']").val(count*1-1);
                }
                $(obj).parent().parent().remove();
            }else {
                var count = $(obj).parent().parent().parent().find("input[name='dropBossReward']").val();
                if(count>0){
                    $(obj).parent().parent().parent().find("input[name='dropBossReward']").val(count*1-1);
                }
                $(obj).parent().parent().remove();
            }
        }

        function jiangliGrp_Clone(obj) {
            console.log(count_02)
            count_02 += 1;
            var postfix = '_' + count_02;
            html = '<div name="cfg1" class="input-group saltIp" style="width:100%;padding:0 0 1px 0; margin-left:fill  ">' +
                '<div class="col-lg-11">'+
                '<legend>Конфигурация подземелья</legend>'+
                '<fieldset>'+
                '<label class="input-group-addon">Подземелье для выпадения</label>' +
                '<input type="text" class="form-control"  name="dropCloneMap" onkeyup="value=value.replace(/\\D/g,\'\')" placeholder="ID подземелья" >' +
                '<div class="hide"><input id="' +'cloneIdx'+count_02 + '" value='+count_02+' name="cloneIdx"/></div>'+
                '<div class="input-group" id="jianglishuju2">'+
                '<label class="input-group-addon">Конфигурация наград:</label>'+
                '<input type="hidden" name="dropCloneReward" value="0">'+
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="jiangliBtn'+count_02+'"'+
                'onclick="jiangliGrp_01(this,\'clone_\',\''+postfix+'\')"><span class="glyphicon glyphicon-plus"></span>'+
                '</button>'+
                '</div>'+
                '</fieldset>'+
                '</div>'+
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delCloneConfig(this,count_02)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации подземелья
        function delCloneConfig(obj,count) {
            count-=1;
            count_02=count;
            $(obj).parent().parent().remove();
        }

        function jiangliGrp_Boss(obj) {
            console.log(count_03);
            count_03 += 1;
            var postfix = '_' + count_03;
            html = '<div name="cfg3" class="input-group saltIp" style="width:100%;padding:0 0 1px 0; margin-left:fill  ">' +
                '<div class="col-lg-11">'+
                '<legend>Конфигурация выпадения у Босса</legend>'+
                '<fieldset>'+
                '<label class="input-group-addon">Выберите тип Босса</label>';
            console.log(bossData);
            if(bossData) {
                $.each(bossData, function (i, n) {
                    html += '<input type="checkbox" name="bossList' + postfix+'" value="' + n.id + '">' +
                        '<label>' + n.name + '</label>';
                });
            }
            else{
                html +='<label>Нет данных о боссах. Загрузите данные о боссах через [Загрузка данных бэкенда] -> [Другие данные] -> [Загрузка типов BOSS]</label>';
            }

            html += '<div class="input-group" id="bossCfg"  name="dropBoss" style="width:100%;padding:0 0 1px 0;">'+
                '<div class="hide"><input id="' +'bossIdx'+count_03 + '" value='+count_03+' name="bossIdx"/></div>'+
                '<div class="input-group" id="jianglishuju3">'+
                '<label class="input-group-addon">Конфигурация наград:</label>'+
                '<input type="hidden" name="dropBossReward" value="0">'+
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="jiangliBtn3'+count_03+'"'+
                'onclick="jiangliGrp_01(this,\'boss_\',\''+postfix+'\')"><span class="glyphicon glyphicon-plus"></span>'+
                '</button>'+
                '</div>'+
                '</fieldset>'+
                '</div>'+
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delBossConfig(this,count_03)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации выпадения у Босса
        function delBossConfig(obj,count) {
            count-=1;
            count_03=count;
            $(obj).parent().parent().remove();
        }

        function jiangliGrp_03(obj) {
            console.log(count_01)
            var rewardInput = 'reward' + count_01;
            var rewardAddBtn = 'showAddItemModel' + count_01;
            var wordsInput = 'words' + count_01;
            var wordsAddBtn = 'showAddWordsModel' + count_01;
            count_01 += 1;
            html = '<div name="cfg4" class="input-group saltIp" style="width:100%;padding:0 0 1px 0; margin-left:fill  ">' +
                '<label class="input-group-addon">Собираемые символы:</label>' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Добавить предмет-символ" id="' + wordsAddBtn +'"  style="border:5px;width: 35px;height: 34px;" ' +
                'onclick="showAddItemUI(' + wordsInput + ',' + wordsAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + wordsInput + '" name="wordItems"/></div>' +
                '</span>' +

                '<label class="input-group-addon">Сундук с наградой:</label>' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Добавить награду" id="' + rewardAddBtn +'"  style="border:5px;width: 35px;height: 34px;" ' +
                'onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="rewardBox"/></div>' +
                '</span>' +

                '<label class="input-group-addon">Максимальное количество обменов:</label>' +
                '<input type="text" class="form-control"  name="exChangeLimit" onkeyup="value=value.replace(/\\D/g,\'\')" placeholder="Максимальное количество обменов" >' +
                '<label class="input-group-addon">Показывать красную точку:</label>' +
                '<div class="col-md-12 col-sm-12 col-xs-12">' +
                '<select name="isShowRedPoint" onchange="" class="form-control heightSet">' +
                '<option value="1">Да</option>'+
                '<option value="0">Нет</option>'+
                '</select>' +
                '</div>'+
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delExChangeConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'

            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации обмена
        function delExChangeConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        $('body').on('hidden.bs.modal', '.modal', function () {
            $(this).removeData('bs.modal');
        });
        $(document).on('click', '#delGridGroup', function () {
            var el = this.parentNode.parentNode
            var saltIp = $(this).parent().parent().find('#saltIp').val()
            el.parentNode.removeChild(el)
            return
        })
    </script>

    <script>
        function validate() {
            return true;
        }
    </script>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <div id="header">
                <h3>Праздничный сбор символов<span class="glyphicon glyphicon-question-sign" title="Описание конфигурации события"
                              data-container="body" data-toggle="popover" data-placement="right"
                              data-content="ID подземелья должен соответствовать таблице clone_map"></span></h3>
            </div>
            <form id="activity_form" method="post" class="form-horizontal" action="#">
                <div th:replace="common/BaseActivity_header.html"></div>

                <div id="customForm">
                    <div class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация выпадения в подземельях</legend>
                            <fieldset>
                                <div class="input-group" id="jianglishujua">
                                    <label class="input-group-addon">Конфигурация пула наград:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="jiangliBtna"
                                            onclick="jiangliGrp_Clone(this)"><span class="glyphicon glyphicon-plus"></span>
                                    </button>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация выпадения у Боссов</legend>
                            <fieldset>
                                <div class="input-group" id="jianglishujub">
                                    <label class="input-group-addon">Конфигурация пула наград:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="jiangliBtnb"
                                            onclick="jiangliGrp_Boss(this)"><span class="glyphicon glyphicon-plus"></span>
                                    </button>
                                </div>
                            </fieldset>
                        </div>
                    </div>


                    <div class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация обмена</legend>
                            <fieldset>
                                <div class="input-group" id="jianglishujuc">
                                    <label class="input-group-addon">Конфигурация обмена:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="jiangliBtnc"
                                            onclick="jiangliGrp_03(this)"><span class="glyphium glyphicon-plus"></span>
                                    </button>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                </div>
            </form>

            <div th:replace="common/import.html"></div>
        </div>

        <div th:replace="common/BaseActivity_footer.html"></div>

        <div th:replace="common/itemAddModel.html"></div>
    </div>
</div>
</body>
</html>
