<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Праздничные желания')" />
    <th:block th:include="include :: footer" />

    <script>

        var actType = [[${type}]];
        var count_01 = 0;
        var count_02 = 0;
        var count_06 = 0;
        var count_07 = 0;
        $(function () {
            getActivityType(actType);
            addHeightSet();
            load(actType);
        });

    </script>

    <script>
        function baodijiangliGrp(obj) {
            console.log("count_01:"+count_01);
            var rewardInput = 'baoDiReward' + count_01;
            var rewardAddBtn = 'showRewardModel' + count_01;
            count_01 += 1;
            html = '<div name="cfg1" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">Очки:</label>' +
                '<input type="text" class="form-control" id="score" name="score" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Гарантированная награда:</label>' +
                // '<input type="text" class="form-control" id="baoDiReward" name="baoDiReward" style="max-width:auto;">' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Гарантированная награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="baoDiReward"/></div>' +
                '</span>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delExChangeConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                // '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Копировать" id="copyGridGroup"><span class="glyphicon glyphicon-copy"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delExChangeConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        function jiangliGrp(obj) {
            console.log("count_02:"+count_02);
            var rewardInput = 'rewardData' + count_02;
            var rewardAddBtn = 'showRewardModel2' + count_02;
            count_02 += 1;
            html = '<div name="cfg2" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">Вес для открытия ключом:</label>' +
                '<input type="text" class="form-control" id="keyWeight" name="keyWeight" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Вес для открытия золотыми слитками:</label>' +
                '<input type="text" class="form-control" id="goldWeight" name="goldWeight" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">Главный приз:</label>' +
                '<select id="isBig" name="isBig" onchange="" class="form-control heightSet" style="min-width:40px;width: 61px;">' +
                '<option value="0">Нет</option>' +
                '<option value="1">Да</option>' +
                '</select>' +
                '<label class="input-group-addon">Показывать:</label>' +
                '<select id="isShow" name="isShow" onchange="" class="form-control heightSet" style="min-width:40px;width: 61px;">' +
                '<option value="0">Нет</option>' +
                '<option value="1">Да</option>' +
                '</select>' +
                '<label class="input-group-addon">Награда:</label>' +
                // '<input type="text" class="form-control" id="rewardData" name="rewardData" style="max-width:auto;">' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="rewardData"/></div>' +
                '</span>' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                // '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Копировать" id="copyGridGroup"><span class="glyphicon glyphicon-copy"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        $(document).on('click', '#copyGridGroup', function () {
            var el = this.parentNode.parentNode;
            var newEl = el.cloneNode(true);
            el.parentNode.insertBefore(newEl, el);
        })
        $(document).on('click', '#delGridGroup', function () {
            var el = this.parentNode.parentNode;
            var saltIp = $(this).parent().parent().find('#saltIp').val();
            el.parentNode.removeChild(el);
            return;
        })
    </script>
    <script>
        function validate() {
            if (checkBaodi() && checkBaoDiRange() && checkBaoDiRangeInfo()){
                return true;
            }else {
                return false;
            }
        }
    </script>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <div id="header">
                <h3>Праздничные желания<span class="glyphicon glyphicon-question-sign" title="Описание конфигурации события"
                              data-container="body" data-toggle="popover" data-placement="right"
                              data-content="При настройке события название события поддерживает многоязычное отображение. Используйте следующий синтаксис: [CH]Китайский (упрощ.)[/CH][EN]Английский[/EN][TW]Китайский (трад.)[/TW][KR]Корейский[/KR][VIE]Вьетнамский[/VIE][TH]Тайский[/TH][JP]Японский[/JP]"></span></h3>
            </div>
            <form id="activity_form" method="post" class="form-horizontal" action="#">
                <div th:replace="common/BaseActivity_header.html"></div>

                <div id="customForm">
                    <div id="costGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация затрат</legend>
                            <fieldset>
                                <div class="input-group saltIp">
                                    <label class="input-group-addon">ID ключа:</label>
                                    <input name="keyId" id="keyId" value="" title="ID ключа" placeholder=""
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Количество ключей на одну попытку:</label>
                                    <input name="oneCostKey" id="oneCostKey" value="" title="Количество ключей на одну попытку"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Количество ключей на десять попыток:</label>
                                    <input name="tenCostKey" id="tenCostKey" value="" title="Количество ключей на десять попыток"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Золотых слитков на одну попытку:</label>
                                    <input name="oneCostGold" id="oneCostGold" value="" title="Золотых слитков на одну попытку"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Золотых слитков на десять попыток:</label>
                                    <input name="tenCostGold" id="tenCostGold" value="" title="Золотых слитков на десять попыток"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="drawCfg" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация розыгрыша</legend>
                            <fieldset>
                                <div class="input-group" id="drawshuju">
                                    <label class="input-group-addon">Благословение за одну попытку:</label>
                                    <input name="addWish" id="addWish" value="" title="Благословение за одну попытку"
                                           type="text" class=" form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Очки за одну попытку:</label>
                                    <input name="addScore" id="addScore" value="" title="Очки за одну попытку"
                                           type="text" class="form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Максимальное благословение:</label>
                                    <input name="wishMax" id="wishMax" value="" title="Максимальное благословение"
                                           type="text" class="form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Главный приз после X попыток:</label>
                                    <input name="wasteGoldCount" id="wasteGoldCount" value="" title="Главный приз после X попыток"
                                           type="text" class="form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="baoDiRewardPool" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация гарантированных наград</legend>
                            <fieldset>
                                <div class="input-group" id="baodishuju">
                                    <label class="input-group-addon">Гарантированные данные:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="baoDiRewardBtn"
                                            onclick="baodijiangliGrp(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                    <input type="hidden" id="cfgCount1" value="0">
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="rewardPool" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация пула наград</legend>
                            <fieldset>
                                <div class="input-group" id="jianglishuju">
                                    <label class="input-group-addon">Данные пула наград:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="jiangliBtn"
                                            onclick="jiangliGrp(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                    <input type="hidden" id="cfgCount2" value="0">
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="luckyGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Настройка удачи</legend>
                            <fieldset>
                                <div class="input-group saltIp">
                                    <label class="input-group-addon">Удача за одно участие:</label>
                                    <input name="oneLuckyValue" id="oneLuckyValue"
                                           type="text" class=" form-control" style="width:100px;" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <label class="input-group-addon">Список наград:</label>
                                    <span class="input-group-btn">
                            <button class="btn btn-info" type="button" data-toggle="tooltip" title="Список наград" id="addOneLuckyBtn"
                                    onclick="showAddItemUI('luckyAwardGift','addOneLuckyBtn')"><span class="glyphicon glyphicon-plus"></span></button>
                            <input type="hidden" id="cfgCount5" value="0">
                        </span>
                                    <input name="luckyAwardGift" id="luckyAwardGift" value="" type="text" class=" hide"/>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="baodiPool" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация гарантированных попыток</legend>
                            <fieldset>
                                <div class="input-group" id="baodinumshuju">
                                    <label class="input-group-addon">Гарантированные попытки:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="baoDiBtn"
                                            onclick="baoDiGrp(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </form>

            <div th:replace="common/import.html"></div>
        </div>

        <div th:replace="common/BaseActivity_footer.html"></div>

        <div th:replace="common/itemAddModel.html"></div>
    </div>
</div>
</body>
</html>
