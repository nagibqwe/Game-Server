                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" id="delGridGroup"><span class="glyphicon glyphicon-minus"></span></button>' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Копировать" id="copyGridGroup"><span class="glyphicon glyphicon-copy"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
    </script>

    <script>
        $(document).on('click', '#copyGridGroup', function () {
            var el = this.parentNode.parentNode
            var newEl = el.cloneNode(true);
            el.parentNode.insertBefore(newEl, el);
        })
        $(document).on('click', '#delGridGroup', function () {
            var el = this.parentNode.parentNode;
            var saltIp = $(this).parent().parent().find('#saltIp').val();
            el.parentNode.removeChild(el);
            return;
        })
    </script>

    <script>
        function validate() {
            return true;
        }
    </script>
