<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Праздничные поздравления')" />
    <th:block th:include="include :: footer" />

    <script>

        var actType = [[${type}]];
        var models=new Map();
        var count_01 = 0;
        var count_02 = 0;
        $(function () {
            getActivityType(actType);
            addHeightSet();
            load(actType);
            loadModel();
        });
        // Загрузка всех моделей из библиотеки
        function loadModel() {
            $.ajax({
                url: ctx + "gmtool/activityConfig/getAllModel",
                method: "post",
                dataType: "json",
                async:false,
                success: function (data) {
                    if (!data.ok) {
                        $.modal.alertError("Ошибка загрузки моделей");
                        return;
                    }
                    $.each(data.data, function (i, n) {
                        models.set(n.id + "",n.tips);
                    });
                }
            });
        }
    </script>

    <script>
        function addPlayerCfg(obj) {
            console.log(count_01);
            var rewardInput = 'dayReward' + count_01;
            var rewardAddBtn = 'showRewardModel' + count_01;
            count_01 += 1;
            var html = '<div name="cfg" class="input-group saltIp" style="">' +
                '<label class="input-group-addon">Количество дней входа:</label>' +
                '<input type="text" class="form-control" name="day" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;">' +
                '<label class="input-group-addon">ID модели:</label>' +
                '<div class="col-md-12 col-sm-12 col-xs-12">' +
                '<select name="modelId" onchange="" class="form-control heightSet"></select>' +
                '</div>'+
                // '<input type="text" class="form-control" name="modelId" style="max-width:auto;" onkeyup="value=value.replace(/\\D/g,\'\')" placeholder="Пример: 1001">' +
                '<label class="input-group-addon">Награда:</label>' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="dayReward"/></div>' +
                '</span>' +
                // '<input type="text" class="form-control" name="dayReward" style="max-width:auto;" placeholder="Пример: 3_1_1_9;1017_1_1_9">' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delExChangeConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
            loadModelData();
        }
        // Удаление конфигурации
        function delExChangeConfig(obj) {
            $(obj).parent().parent().remove();
        }
        // Генерация опций выпадающего списка
        var countModel=0;
        function loadModelData() {
            models.forEach(function(value, key) {
                $("select[name='modelId']").eq(countModel).append("<option value='" + key +"'>" + value +"</option>");
            });
            countModel+=1;
        }
    </script>

    <script>
        function addServerCfg(obj) {
            var rewardInput = 'serverReward' + count_02;
            var rewardAddBtn = 'showRewardModel2' + count_02;
            count_02 += 1;
            var html = '<div name="cfg" class="input-group saltIp" style="">' +
                '<label class="input-group-addon">ID сундука:</label>' +
                '<input type="text" class="form-control" name="boxId" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;" placeholder="Пример: 100">' +
                '<label class="input-group-addon">Необходимый прогресс:</label>' +
                '<input type="text" class="form-control" name="need" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:100px;" placeholder="Пример: 500">' +
                '<label class="input-group-addon">Награда:</label>' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Награда" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="serverReward"/></div>' +
                '</span>' +
                // '<input type="text" class="form-control" name="serverReward" style="max-width:auto;" placeholder="Пример: 3_1_1_9;1017_1_1_9">' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        $(document).on('click', '#copyGridGroup', function () {
            var el = this.parentNode.parentNode
            var newEl = el.cloneNode(true);
            el.parentNode.insertBefore(newEl, el);
        })
        $(document).on('click', '#delGridGroup', function () {
            var el = this.parentNode.parentNode
            var saltIp = $(this).parent().parent().find('#saltIp').val()
            el.parentNode.removeChild(el)

            var count = $("#gridCount").val();
            if (count > 0) {
                count = Number(count) - 1;
                $("#gridCount").val(count);
            }
            return
        })
    </script>

    <script>
        function validate() {
            return true;
        }
    </script>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <div id="header">
                <h3>Праздничные поздравления<span class="glyphicon glyphicon-question-sign" title="Описание конфигурации события"
                              data-container="body" data-toggle="popover" data-placement="right"
                              data-content="При настройке события название события поддерживает многоязычное отображение. Используйте следующий синтаксис: [CH]Китайский (упрощ.)[/CH][EN]Английский[/EN][TW]Китайский (трад.)[/TW][KR]Корейский[/KR][VIE]Вьетнамский[/VIE][TH]Тайский[/TH][JP]Японский[/JP]"></span></h3>
            </div>
            <form id="activity_form" method="post" class="form-horizontal" action="#">
                <div th:replace="common/BaseActivity_header.html"></div>

                <div id="customForm">
                    <div id="costGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация пропусков</legend>
                            <fieldset>
                                <div name="cfgDiv" class="input-group saltIp">
                                    <label class="input-group-addon">ID предмета для пропуска:</label>
                                    <input name="buqianid" id="buqianid" value="" title="ID предмета для пропуска" placeholder="Пример: 1017"
                                           type="text" class="form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                    <!--<span class="input-group-btn">-->
                        <!--<button class="btn btn-info" type="button" data-toggle="tooltip" title="Конфигурация пропуска" id="addGoldGiftBtn" onclick="showAddItemUI('i_GoldGift','addGoldGiftBtn')"><span class="glyphicon glyphicon-plus"></span></button>-->
                        <!--</span>-->
                                    <!--<input name="i_GoldGift" id="i_GoldGift" value="" type="text" class="hide"/>-->
                                    <label class="input-group-addon">Стоимость пропуска:</label>
                                    <input name="buqianCost" id="buqianCost" value="" title="Стоимость пропуска" placeholder="Пример: 200"
                                           type="text" class="form-control" onkeyup="value=value.replace(/\D/g,'')"/>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="playerGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Конфигурация ежедневного входа</legend>
                            <fieldset>
                                <div class="input-group" id="serverPrcCfg">
                                    <label class="input-group-addon">Конфигурация наград:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="playerGroupBtn"
                                            onclick="addPlayerCfg(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>

                    <div id="serverGroup" class="col-lg-12 col-sm-12 col-md-12">
                        <div class="col-lg-1"></div>
                        <div class="col-lg-11">
                            <legend>Награды для всех серверов</legend>
                            <fieldset>
                                <div class="input-group" id="serverRewardCfg">
                                    <label class="input-group-addon">Конфигурация наград:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="addServerCfgBtn"
                                            onclick="addServerCfg(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </form>

            <div th:replace="common/import.html"></div>
        </div>

        <div th:replace="common/BaseActivity_footer.html"></div>

        <div th:replace="common/itemAddModel.html"></div>
    </div>
</div>
</body>
</html>
