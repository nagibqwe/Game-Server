<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Лимитированные наборы')" />
    <th:block th:include="include :: footer" />

    <script>

        var actType = [[${type}]];
        var count_01 = 0;
        $(function () {
            getActivityType(actType);

            load(actType);
        });

    </script>

    <script>
        function func() {
            var val = $("#i_coin").val();
            if (val === "1") {
                $("#i_coin").css("color", "goldenrod")
            }else if (val === "12") {
                $("#i_coin").css("color", "silver")
            }
        }
    </script>

    <script>

        function addSaltIpGrp(obj) {
            console.log(count_01);
            var rewardInput = 'i_RewardGroup' + count_01;
            var rewardAddBtn = 'showRewardModel' + count_01;
            count_01 += 1;
            html = '<div name="cfg1" class="input-group saltIp" style="width:100%;padding:0 0 1px 0;">' +
                '<label class="input-group-addon">ID набора:</label>' +
                '<input type="text" class="form-control" id="i_id" name="i_id" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:120px;">' +
                '<label class="input-group-addon">Название набора:</label>' +
                '<input type="text" class="form-control" id="i_name" name="i_name" style="max-width:120px;">' +
                '<label class="input-group-addon">Лимит покупок:</label>' +
                '<input type="text" class="form-control" id="i_limit" name="i_limit" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:120px;">' +
                '<label class="input-group-addon">Скидка на набор:</label>' +
                '<input type="text" class="form-control" id="i_discount" name="i_discount" onkeyup="value=value.replace(/[^\\d.]/g,\'\')" style="max-width:120px;">' +
                '<select id="i_coin" name="i_coin" onchange="func()" class="form-control" style="min-width:40px;width: 88px; color: goldenrod">' +
                '<option style="color: goldenrod" value="1">Золотые слитки</option>' +
                '<option style="color: silver" value="12">Серебряные слитки</option>' +
                '</select>' +
                '<input type="text" class="form-control" id="i_coin_count" name="i_coin_count" onkeyup="value=value.replace(/\\D/g,\'\')" style="max-width:120px;">' +
                '<label class="input-group-addon">Группа предметов набора:</label>' +
                '<span class="input-group-btn" >' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" data-target="#addItemModal" title="Группа предметов набора" id="' + rewardAddBtn +
                '"  style="border:5px;width: 35px;height: 34px;" onclick="showAddItemUI(' + rewardInput + ',' + rewardAddBtn + ')">' +
                '<span class="glyphicon glyphicon-plus"></span></button>' +
                '<div class="hide"><input id="' + rewardInput + '" name="i_RewardGroup"/></div>' +
                '</span>' +
                // '<input type="text" class="form-control" id="i_RewardGroup" name="i_RewardGroup"  style="max-width:auto;">' +
                '<span class="input-group-btn">' +
                '<button class="btn btn-info" type="button" data-toggle="tooltip" title="Удалить" onclick="delExChangeConfig(this)"><span class="glyphicon glyphicon-minus"></span></button>' +
                '</span>' +
                '</div>'
            obj.insertAdjacentHTML('beforeBegin', html);
            addHeightSet();
        }
        // Удаление конфигурации
        function delExChangeConfig(obj) {
            $(obj).parent().parent().remove();
        }
    </script>

    <script>
        function validate() {
            return true;
        }
    </script>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <div id="header">
                <h3>Лимитированные наборы<span class="glyphicon glyphicon-question-sign" title="Описание конфигурации события"
                              data-container="body" data-toggle="popover" data-placement="right"
                              data-content="ID набора: должен быть уникальным для идентификации набора<br/>
                                Название набора: рекомендуется минимум 10 символов (при большем количестве шрифт автоматически уменьшается)<br/>
                                Лимит покупок: максимальное количество покупок на одного персонажа<br/>
                                Скидка на набор: отображается только на клиентской стороне для демонстрации скидки, не участвует в расчёте цены<br/>
                                Выбор валюты: золотые слитки = духовные нефриты, серебряные слитки = слитки; затем укажите количество валюты для покупки одного набора<br/>
                                Группа предметов набора: содержимое набора"></span></h3>
            </div>
            <form id="activity_form" method="post" class="form-horizontal" action="#">
                <div th:replace="common/BaseActivity_header.html"></div>

                <div id="customForm">
                    <div class="col-lg-12 col-sm-12 col-md-12">
                        <!--<div class="col-lg-1"></div>-->
                        <div class="col-lg-12">
                            <legend>Конфигурация лимитированных наборов</legend>
                            <fieldset>
                                <div class="input-group" id="saltIpGroup">
                                    <label class="input-group-addon">Список конфигураций:</label>
                                    <button class="btn btn-info" type="button" data-toggle="tooltip" title="Добавить" id="addSaltIpGrpBtn"
                                            onclick="addSaltIpGrp(this)"><span class="glyphicon glyphicon-plus"></span></button>
                                    <input type="hidden" id="cfgCount1" value="0">
                                </div>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </form>

            <div th:replace="common/import.html"></div>
        </div>

        <div th:replace="common/BaseActivity_footer.html"></div>

        <div th:replace="common/itemAddModel.html"></div>
    </div>
</div>
</body>
</html>
