<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Списание предметов')" />
    <th:block th:include="include :: footer" />
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>Списание предметов</h5>
                </div>
                <div class="ibox-content">
                    <form id="deductItemForm" class="form-horizontal m-t" method="post">

                        <div class="form-group">
                            <div th:replace="common/select_server_single.html"></div>
                            <!-- Здесь настраивается сопоставление адресов групповых запросов к серверу -->
                            <input type="hidden" id="requestUrl" value="gameServer">
                            <input type="hidden" id="ignoreMerge" value="1">
                        </div>
                        <div id="roleDiv" class="form-group">
                            <label class="col-sm-2 control-label is-required" for="roleId">ID персонажа:</label>
                            <div class="col-sm-2">
                                <input class="form-control" id="roleId" type="text" name="roleId" required/>
                            </div>
                        </div>
                        <div class="form-group">
                        <label class="col-sm-2 control-label is-required" for="itemId">ID предмета:</label>
                            <div class="col-sm-2">
                                <input type="text" id="itemId" name="itemId" onkeyup="this.value=this.value.replace(/^(0+)|[^\d]+/g,'')" placeholder="ID предмета" list="itemList" style="width: 100%" class="selectClass"/>
                                <datalist id="itemList"></datalist>
                            </div>
                            <div class="col-sm-2">
                                <input id="itemNum" name="dedCount" type="text" onkeyup="this.value=this.value.replace(/^(0+)|[^\d]+/g,'')" placeholder="Количество предметов" style="width: 100%" class="selectClass"/>
                            </div>
                            <div class="col-sm-1">
                                <select name="isBind" class="selectClass" style="width: 70px">
                                    <option value="0">Не привязан</option>
                                    <option value="1">Привязан</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="reason" class="col-sm-2 control-label is-required">Причина:</label>
                            <div class="col-sm-2">
                                <input id="reason" type="text" name="reason" class="form-control" required/>
                            </div>
                            <label class="col-sm-1 control-label">
                                <input id="mailCheckBox" style="width: 18px;height: 15px;" type="checkbox" onclick="showMailDiv()"/>Отправить письмом
                            </label>
                            <input type="hidden" id="isMail" name="isMail" value="0"/>
                        </div>
                        <div id="mailDiv">
                            <div class="form-group">
                                <label for="mailTitle" class="col-sm-2 control-label">Тема письма:</label>
                                <div class="col-sm-8">
                                    <input id="mailTitle" type="text" name="mailTitle" class="form-control" required/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="mailContent" class="col-sm-2 control-label">Текст письма:</label>
                                <div class="col-sm-8">
                                    <textarea id="mailContent" type="text" name="mailContent" class="form-control" required></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label"></label>
                            <button type="button" class="btn btn-primary" onclick="deductSubmit()">
                                Списать
                            </button>
                        </div>

                        <div id="msg" class="container-fluid"></div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/deductItem";

        $(function () {
            loadAllItem();
            $("#mailDiv").hide();
            serverGroupChange();
        });

        $(function() {
            var platform = $("#select_group").val();
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "Списание предметов",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'ID'
                },
                {
                    title: 'Платформа',
                    formatter:function (value, row, index) {
                        return platform;
                    }
                },
                {
                    field: 'serverId',
                    title: 'ID сервера'
                },
                {
                    field: 'itemId',
                    title: 'ID предмета'
                },
                {
                    field: 'roleId',
                    title: 'ID персонажа'
                },
                {
                    field: 'dedCount',
                    title: 'Запрошено к списанию'
                },
                {
                    field: 'realCount',
                    title: 'Фактически списано'
                },
                {
                    field: 'isBind',
                    title: 'Привязка'
                },
                {
                    field: 'mailTitle',
                    title: 'Тема письма'
                },
                {
                    field: 'mailContent',
                    title: 'Текст письма'
                },
                {
                    field: 'dedTime',
                    title: 'Время списания'
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="delDeductItem(\'' + row.id + '\')"><i class="fa fa-remove"></i>Удалить</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });


        function showMailDiv() {
            var show = $("#mailCheckBox").prop("checked");
            $("#mailDiv").toggle(show);
            $("#isMail").val(show ? "1" : "0");
        }

        // Операция списания
        function deductSubmit() {
            var select_server = $("#select_server").val();
            if (!$('#deductItemForm').validate().form()) {
                $.modal.msgError("Ошибка валидации");
                return;
            }
            $.ajax({
                url: prefix + "/deductItemByRoleId",
                data: $("#deductItemForm").serialize(),
                method: "post",
                dataType: "json",
                success: function (data) {
                    if (data.ok) {
                        $("#deductItemForm")[0].reset();
                        $("#mailDiv").hide();
                        $.modal.alertSuccess(data.msg);
                        $("#select_server").val(select_server);
                        $.table.search();
                    }else {
                        $.modal.alertError(data.msg);
                    }
                }
            });
        }

        // Удаление
        function delDeductItem(id) {
            var select_server = $("#select_server").val();
            $.ajax({
                url: prefix + "/delDeductItem",
                data: {
                    id: id
                },
                method: "post",
                dataType: "json",
                async: false,
                success: function (data) {
                    if (data.ok) {
                        $.modal.alertSuccess(data.msg);
                        $("#select_server").val(select_server);
                        $.table.search();
                    }else {
                        $.modal.alertError(data.msg);
                    }
                }
            });
        }
    </script>
</body>
</html>
