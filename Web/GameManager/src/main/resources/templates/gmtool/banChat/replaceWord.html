<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Слова для замены в чате')" />
    <th:block th:include="include :: footer" />
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <div th:replace="common/select_server_single.html"></div>
                            <!-- Здесь настраивается сопоставление адресов групповых запросов к серверу -->
                            <input type="hidden" id="requestUrl" value="gameServer">
                            <input type="hidden" id="ignoreMerge" value="1">

                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()">
                <i class="fa fa-plus"></i> Добавить
            </a>
<!--            <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="gmtool:banChat:edit">-->
<!--                <i class="fa fa-edit"></i> Редактировать-->
<!--            </a>-->
<!--            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="gmtool:banChat:removeShieldWord">-->
<!--                <i class="fa fa-remove"></i> Удалить-->
<!--            </a>-->
            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="gmtool:banChat:exportReplaceWord">
                <i class="fa fa-download"></i> Экспорт
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<script th:inline="javascript">
    // var editFlag = [[${@permission.hasPermi('gmtool:banChat:editReplaceWord')}]];
    // var removeFlag = [[${@permission.hasPermi('gmtool:banChat:removeReplaceWord')}]];
    var prefix = ctx + "gmtool/banChat";

    $(function() {
        var op = {
            url: prefix + "/searchReplaceWord",
            createUrl: prefix + "/addReplaceWord",
            // removeUrl: prefix + "/removeReplaceWord?serverId="+$("#select_server").val()+"&id={id}",
            exportUrl: prefix + "/exportReplaceWord",
            modalName: "Список слов для замены",
            pagination: false,
            firstLoad: false,
            columns: [{
                checkbox: false
            },
            {
                field: 'id',
                title: 'ID'
            },
            {
                field: 'relaceType',
                title: 'Тип замены'
            },
            {
                field: 'word',
                title: 'Содержимое'
            },
            {
                field: 'replaceWord',
                title: 'Текст для замены'
            },
            {
                title: 'Действия',
                align: 'center',
                formatter: function(value, row, index) {
                    var actions = [];
                    actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="removeData(\'' + row.id + '\')">Удалить</a>');
                    // actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>Удалить</a>');
                    return actions.join('');
                }
            }
            ],
            onLoadSuccess: function(data) {
            },
            onPostBody: function(data) {
            }
        };

        $.table.init(op);
    });

    function removeData(id) {
        $.ajax({
            type: "POST",
            url: prefix + "/removeReplaceWord",
            data: {
                "serverId" : $("#select_server").val(),
                "id" : id
            },
            // data:$("#formId2").serialize(),
            dataType: "json",
            success: function(data){
                if (!data.ok) {
                    $.modal.alertError(data.msg);
                }else {
                    $.modal.alertSuccess("Операция выполнена");
                }
                $.table.refresh();
            }
        });
    }


</script>
</body>
</html>
