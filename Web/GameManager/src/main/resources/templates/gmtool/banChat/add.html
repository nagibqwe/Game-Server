<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Добавить блокировку чата')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-banChat-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label">Аккаунт для блокировки чата:</label>
                <div class="col-sm-8">
                    <input name="userId" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Тип нарушения: 1 — нелегальная деятельность, 2 — запрещённая информация:</label>
                <div class="col-sm-8">
                    <select name="crimeType" class="form-control m-b">
                        <option value="">Все</option>
                    </select>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> При генерации кода выберите атрибут словаря</span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Тип блокировки чата: 1 — блокировка фермеров, 2 — замена текста, 3 — блокировка по ключевым словам, 4 — обычная блокировка, 5 — скрытая блокировка, 6 — изоляционная блокировка:</label>
                <div class="col-sm-8">
                    <select name="banType" class="form-control m-b">
                        <option value="">Все</option>
                    </select>
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> При генерации кода выберите атрибут словаря</span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Окончание блокировки:</label>
                <div class="col-sm-8">
                    <input name="endTime" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Причина:</label>
                <div class="col-sm-8">
                    <textarea name="reason" class="form-control"></textarea>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Отправить на список игровых серверов:</label>
                <div class="col-sm-8">
                    <input name="serverIds" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Статус: 0 — заблокирован, 1 — разблокирован:</label>
                <div class="col-sm-8">
                    <input name="state" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/banChat"
        $("#form-banChat-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-banChat-add').serialize());
            }
        }
    </script>
</body>
</html>
