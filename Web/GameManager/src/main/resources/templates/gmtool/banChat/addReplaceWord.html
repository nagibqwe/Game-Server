<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Добавить слово для замены в чате')" />
    <th:block th:include="include :: footer" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-replaceWord-add">
            <div class="col-md-12">
                <div class="form-group">
                    <div th:replace="common/select_server_single.html"></div>
                    <!-- Здесь настраивается сопоставление адресов групповых запросов к серверу -->
                    <input type="hidden" id="requestUrl" value="gameServer">
                    <input type="hidden" id="ignoreMerge" value="1">
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label">Тип:</label>
                    <div class="col-sm-8">
                        <select id="replaceType" class="form-control">
                            <option value="0">Ключевое слово</option>
                            <option value="1">Целая фраза</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label">Содержимое:</label>
                    <div class="col-sm-8">
                        <input id="word" class="form-control" type="text">
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-sm-3 control-label">Текст для замены:</label>
                    <div class="col-sm-8">
                        <textarea id="replaceWord" class="form-control" ></textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        var prefix = ctx + "gmtool/banChat";

        $(function() {
            $("#select_group_label").attr('class','col-sm-3 control-label');
        });

        $("#form-replaceWord-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/addReplaceWord",
                    // $('#form-replaceWord-add').serialize()
                    {
                        "serverId" : $("#select_server").val(),
                        "replaceType" : $("#replaceType").val(),
                        "word" : $("#word").val(),
                        "replaceWord" : $("#replaceWord").val()
                    }
                );
            }
        }
    </script>
</body>
</html>
