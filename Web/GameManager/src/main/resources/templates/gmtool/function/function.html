<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('gmtool:function:edit')}]];
    var prefix = ctx + "gmtool/function";

    // Просмотр переключателей функций сервера
    function queryServerInfo() {
        $.post(ctx + "gmtool/function/queryFunction", $("#formId1").serialize(), function (gameData) {
            // console.log(JSON.stringify(gameData));

            if (gameData.code == 0) {
                var op = {
                    // id: 'functionSwitch',
                    url: prefix + "/list",
                    modalName: "Функции игры",
                    pagination: false,
                    // pageSize: 9999,
                    columns: [{
                        checkbox: false
                    },
                        {
                            field: 'funcId',
                            title: 'ID функции'
                        },
                        {
                            field: 'funcName',
                            title: 'Название функции'
                        },
                        {
                            field: 'parentId',
                            title: 'ID родителя'
                        },
                        // {
                        //     field: 'openState',
                        //     title: 'Статус включения'
                        // },
                        {
                            field: 'opSwitch',
                            title: 'Действия',
                            align: 'center',
                            formatter: function(value, row, index) {
                                var actions = [];
                                // console.log($.table.selectColumns('funcId'));
                                var gd = gameData.data.data;
                                for(var j=0; j<gd.length; j++){
                                    if(gd[j].id == row.funcId){
                                        // var switchState = gd[j].id+'@'+gd[j].openState;
                                        if(gd[j].openState == 1){
                                            actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="setFunctionSwitch(\'' + index + '\',\'' + row.funcId + '\',\''+ gd[j].openState + '\')">Выключить</a><input type="hidden" name="funcSwitch" value="" />');
                                        }else{
                                            actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="setFunctionSwitch(\'' + index + '\',\'' + row.funcId + '\',\''+ gd[j].openState + '\')">Включить</a><input type="hidden" name="funcSwitch" value="" />');
                                        }
                                    }
                                }
                                // actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.funcId + '\')"><i class="fa fa-edit"></i>Редактировать</a> ');
                                // actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.funcId + '\')"><i class="fa fa-remove"></i>Удалить</a>');
                                return actions.join('');
                            }
                        }
                        ],
                    onLoadSuccess: function(data) {
                        // console.log(JSON.stringify(data));
                        // console.log(data);
                    },
                    onPostBody: function(data) {
                        // console.log(JSON.stringify(data));
                        // console.log(data);
                    }
                };

                $.table.init(op);
            } else {
                $.modal.alertError(gameData.msg);
            }
        });
    }

            //     $("input[name='funcSwitch']").eq(index).val('');
            //     // $("input[name='funcSwitch']").eq(index).parent().find("a").prop('class',initState==1?'btn btn-primary btn-xs':'btn btn-danger btn-xs');
            //     // $("input[name='funcSwitch']").eq(index).parent().find("a").text(initState==1?'Выключить':'Включить');
            //     return;
            // }

            $("input[name='funcSwitch']").eq(index).val(funcId+'@1');
            $("input[name='funcSwitch']").eq(index).parent().find("a").prop('class','btn btn-danger btn-xs');
            $("input[name='funcSwitch']").eq(index).parent().find("a").text('Выключить');
        }else{//''
            $("input[name='funcSwitch']").eq(index).val(initState==1?funcId+'@0':funcId+'@1');
            $("input[name='funcSwitch']").eq(index).parent().find("a").prop('class',initState==1?'btn btn-primary btn-xs':'btn btn-danger btn-xs');
            $("input[name='funcSwitch']").eq(index).parent().find("a").text(initState==1?'Включить':'Выключить');

        // $("input[name='funcSwitch']").eq(index).val(old == funcId+'@1'?funcId+'@0':funcId+'@1');
        // // console.log($("input[name='funcSwitch']").eq(index).parent().find("a").text());

        // //     setFunctionSwitch( index, funcId, state);
        // // });
        //
        // $("input[name='funcSwitch']").eq(index).parent().find("a").attr('class',old == funcId+'@1'?'btn btn-primary btn-xs':'btn btn-danger btn-xs');
        // var oldText = $("input[name='funcSwitch']").eq(index).parent().find("a").text();
        // $("input[name='funcSwitch']").eq(index).parent().find("a").text(oldText=='Включить'?'Выключить':'Включить');
    }

    function saveFunctionSwitch() {
        var switchIs = '';
        $("input[name='funcSwitch']").each(function (i) {
            var str = $(this).val();
            if(!isEmpty(str)){
                switchIs += str + ",";
            }
        });
        if(isEmpty(switchIs)){
            return;
        }
        switchIs = switchIs.slice(0,switchIs.length-1);
        $.modal.confirm("Подтвердить сохранение изменений?", function () {
            $.ajax({
                type: "POST",
                url: prefix + "/sendFunctionSwitch",
                data: {"serverId" : $("#select_server").val(),"funcSwitch" : switchIs},
                // data:$("#formId2").serialize(),
                dataType: "json",
                success: function(data){
                    if (!data.ok) {
                        $.modal.alertError(data.msg);
                    }else {
                        $.modal.alertSuccess("Операция выполнена");
                        queryServerInfo();
                    }
                    // $.table.refresh();
                }
            });
        });
    }

</script>
