<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Добавить сервер')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-server-add">
             <div class="form-group">
                    <label class="col-sm-3 control-label is-required">ID сервера:</label>
                    <div class="col-sm-8">
                        <input name="serverId" class="form-control" type="text" onblur="checkInput('serverId')" required>
                        <span id="checkServerId"></span>
                    </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Название сервера:</label>
                <div class="col-sm-8">
                    <input name="serverName" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Платформа:</label>
                <div class="col-sm-8">
                    <input name="groupName" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">IP сервера:</label>
                <div class="col-sm-8">
                    <input name="serverIP" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Порт сервера:</label>
                <div class="col-sm-8">
                    <input name="serverPort" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">IP базы данных логов:</label>
                <div class="col-sm-8">
                    <input name="dblogIp" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Порт базы данных логов:</label>
                <div class="col-sm-8">
                    <input name="dblogPort" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Название базы данных логов:</label>
                <div class="col-sm-8">
                    <input name="dblogName" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Пользователь базы данных логов:</label>
                <div class="col-sm-8">
                    <input name="dblogUser" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Пароль базы данных логов:</label>
                <div class="col-sm-8">
                    <input name="dblogPwd" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Тип сервера:</label>
                <div class="col-sm-8">
                    <select name="serverType" class="form-control m-b" required>
                        <option value="0" selected>Тестовый сервер</option>
                        <option value="1">Основной сервер</option>
                        <option value="2">Сервер входа</option>
                        <option value="3">Общий сервер</option>
                        <option value="4">Межсерверный</option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Время открытия сервера:</label>
                <div class="col-sm-8">
                    <input name="serverOpenTime" class="form-control" type="text" placeholder="2021-05-08 17:45:00">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Статус открытия:</label>
                <div class="col-sm-8">
                    <select name="openState" class="form-control m-b" required>
                        <option value="0">Резервный</option>
                        <option value="1">Открыт</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Активен:</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" id="isDeleted0" name="isDeleted" value="0" checked="checked">
                        <label for="isDeleted0">Да</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" id="isDeleted1" name="isDeleted" value="1">
                        <label for="isDeleted1">Нет</label>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/server"
        $("#form-server-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-server-add').serialize());
            }
        }

        $("input[name='hefuTime']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });

    </script>
</body>
</html>
