<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список циклических объявлений')" />
</head>
<body class="gray-bg">
     <div class="container-fluid">
         <div class="container-fluid" style="margin-top: 10px">
             <a id="mail1" class="label label-info" onclick="toggleTable(enableListDiv)">Активные</a>
             <div class="btn-group-sm" id="toolbar1" role="group">
                 <a class="btn btn-success" onclick="$.operate.add()">
                     <i class="fa fa-plus"></i> Добавить
                 </a>
             </div>

             <div id="enableListDiv" class="col-sm-12 select-table table-striped"
                  style="word-break:break-all; word-wrap:break-all;">
                 <table id="enableList"></table>
             </div>
         </div>
         <div class="container-fluid" style="margin-top: 10px">
             <a id="mail3" class="label label-info" onclick="toggleTable(disableListDiv)">Отключённые</a>
             <div id="disableListDiv" class="col-sm-12 select-table table-striped"
                  style="word-break:break-all; word-wrap:break-all;">
                 <table id="disableList"></table>
             </div>
         </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/cyAnnounce";

        $(function() {
            initTable("enableList","toolbar1",prefix+"/list");
            initTable("disableList","toolbar",prefix+"/disableList");
            setInterval(function () {
                $.table.search("", "enableList");
                $.table.search("", "disableList");
            }, 5000);
        });
        function initTable(id,toolbar,url) {
            var options = {
                id:id,
                toolbar:toolbar,
                url:url,
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                showSearch:false,
                modalName: "Циклическое объявление",
                columns: [
                    {
                        field: 'id',
                        title: 'ID',
                        visible: false
                    },
                    {
                        title: '№',
                        formatter: function (value, row, index) {
                            return $.table.serialNumber(index);
                        }
                    },
                    {
                        field: 'content',
                        title: 'Содержимое объявления'
                    },
                    {
                        field: 'createDate',
                        title: 'Время создания'
                    },
                    {
                        field: 'createUserName',
                        title: 'Создатель'
                    },
                    {
                        field: 'serverIds',
                        title: 'Серверы отправки'
                    },
                    {
                        field: 'fromDate',
                        title: 'Дата начала'
                    },
                    {
                        field: 'toDate',
                        title: 'Дата окончания'
                    },
                    {
                        field: 'totalTimes',
                        title: 'Всего показов'
                    },
                    {
                        field: 'nowTimes',
                        title: 'Текущее количество'
                    },
                    {
                        field: 'cycleInterval',
                        title: 'Интервал (мин)'
                    },
                    {
                        field: 'nextDate',
                        title: 'Следующее время показа'
                    },
                    {
                        field: 'state',
                        title: 'Статус',
                        formatter:function (value, row, index) {
                            if (value == 0){
                                return "Активно";
                            }else if (value == 1){
                                return "Отключено";
                            }else if (value == 2){
                                return "Просрочено";
                            }else if (value == 3){
                                return "Завершено";
                            }else if (value == 4){
                                return "Удалено";
                            } else {
                                return "Неизвестно";
                            }
                        }
                    },
                    {
                        title: 'Действия',
                        align: 'center',
                        formatter: function(value, row, index) {
                            var actions = [];
                            if (row.state == 1){
                                actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="updateState(\'' + row.id + '\',0)"><i class="fa fa-edit"></i>Активировать</a> ');
                            }else if (row.state == 0){
                                actions.push('<a class="btn btn-warning btn-xs" href="javascript:void(0)" onclick="updateState(\'' + row.id + '\',1)"><i class="fa fa-edit"></i>Отключить</a> ');
                            }else if (row.state < 4){
                                actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="deleteCyAnnounce(\'' + row.id + '\')"><i class="fa fa-remove"></i>Удалить</a> ');
                            }
                            return actions.join('');
                        }
                    }]
            };
            $.table.init(options);
        }

        // Обновление статуса циклического объявления
        function updateState(id, value) {
            $.modal.confirm("Подтвердить выполнение операции с объявлением?", function(){
                $.post(prefix + "/jYCyAnnounce",
                    {announceId: id, state: value},
                    function (data) {
                        if (data.ok) {
                            $.modal.alertSuccess(data.msg);
                            $.table.search("", "enableList");
                            $.table.search("", "disableList");
                        } else {
                            $.modal.alertError(data.msg);
                        }
                    });
            });
        }

        // Удаление циклического объявления
        function deleteCyAnnounce(id) {
            $.modal.confirm("Подтвердить удаление?", function(){
                $.post(prefix + "/deleteCyAnnounce",
                    {announceId: id},
                    function (data) {
                        if (data.ok) {
                            $.modal.alertSuccess(data.msg);
                            $.table.search("", "enableList");
                            $.table.search("", "disableList");
                        } else {
                            $.modal.alertError(data.msg);
                        }
                    });
            });
        }

    </script>
</body>
</html>
