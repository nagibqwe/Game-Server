<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список тестовых пополнений через GM')" />
    <th:block th:include="include :: footer" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
<!--                            <li>-->
<!--                                <div th:replace="common/select_server_single.html"></div>-->
<!--                                &lt;!&ndash; Здесь настраивается сопоставление адресов групповых запросов к серверу &ndash;&gt;-->
<!--                                <input type="hidden" id="requestUrl" value="gameServer">-->
<!--                                <input type="hidden" id="ignoreMerge" value="1">-->
<!--                            </li>-->
                            <li>
                                <label>ID сервера операции:</label>
                                <input type="text" name="toServerId"/>
                            </li>
                            <li>
                                <label>ID персонажа:</label>
                                <input type="text" name="roleId"/>
                            </li>
                            <li>
                                <label class="col-sm-3 control-label">Статус пополнения:</label>
                                <div class="col-sm-8">
                                    <select id="rechargeState" name="rechargeState" class="form-control" data-first-title="Все статусы">
                                        <option value="">Все статусы</option>
                                        <option value="0">Ожидает проверки</option>
                                        <option value="1">Проверено</option>
                                        <option value="2">Отклонено</option>
                                    </select>
                                </div>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="gmtool:recharge:add">
                    <i class="fa fa-plus"></i> Добавить тестовое пополнение
                </a>
<!--                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="gmtool:recharge:edit">-->
<!--                    <i class="fa fa-edit"></i> Редактировать-->
<!--                </a>-->
<!--                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="gmtool:recharge:remove">-->
<!--                    <i class="fa fa-remove"></i> Удалить-->
<!--                </a>-->
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="gmtool:recharge:export">
                    <i class="fa fa-download"></i> Экспорт
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        var verifyFlag = [[${@permission.hasPermi('gmtool:recharge:verify')}]];
        // var removeFlag = [[${@permission.hasPermi('gmtool:recharge:remove')}]];
        var prefix = ctx + "gmtool/recharge";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                // firstLoad: false,
                // pagination: false,
                modalName: "Тестовые пополнения через GM",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'ID',
                    visible: false
                },
                {
                    field: 'roleId',
                    title: 'ID персонажа'
                },
                {
                    field: 'rechargeNumber',
                    title: 'Сумма пополнения (в центах)'
                },
                {
                    field: 'rechargeTotalGold',
                    title: 'Накопительная сумма пополнения'
                },
                {
                    field: 'rechargeVipExp',
                    title: 'VIP-опыт за пополнение'
                },
                {
                    field: 'rechargeState',
                    title: 'Статус пополнения: 0 — ожидает проверки, 1 — проверено, 2 — отклонено'
                },
                {
                    field: 'reason',
                    title: 'Причина операции'
                },
                {
                    field: 'toServerId',
                    title: 'ID сервера операции'
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        if(row.rechargeState == '0'){
                            actions.push('<a class="btn btn-success btn-xs ' + verifyFlag + '" href="javascript:void(0)" onclick="agree(\'' + row.id + '\')"><i class="fa fa-edit"></i>Одобрить</a> ');
                            actions.push('<a class="btn btn-danger btn-xs ' + verifyFlag + '" href="javascript:void(0)" onclick="reject(\'' + row.id + '\')"><i class="fa fa-remove"></i>Отклонить</a>');
                        }
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        function agree(id) {
            $.modal.confirm("Подтвердить одобрение?", function () {
                $.ajax({
                    type: "POST",
                    url: prefix + "/agree",
                    data: {
                        "id": id
                    },
                    dataType: "json",
                    success: function (data) {
                        if (!data.ok) {
                            $.modal.alertError(data.msg);
                        } else {
                            $.modal.alertSuccess("Операция выполнена");
                        }
                        $.table.refresh();
                    }
                });
            });
        }

        function reject(id) {
            $.modal.confirm("Подтвердить отклонение?", function () {
                $.ajax({
                    type: "POST",
                    url: prefix + "/reject",
                    data: {
                        "id": id
                    },
                    dataType: "json",
                    success: function (data) {
                        if (!data.ok) {
                            $.modal.alertError(data.msg);
                        } else {
                            $.modal.alertSuccess("Операция выполнена");
                        }
                        $.table.refresh();
                    }
                });
            });
        }
    </script>
</body>
</html>
