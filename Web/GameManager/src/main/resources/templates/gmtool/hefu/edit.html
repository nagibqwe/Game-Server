<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Редактировать объединение серверов')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-hefu-edit" th:object="${hefu}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Исходные серверы:</label>
                <div class="col-sm-8">
                    <input name="fromServer" th:field="*{fromServer}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Целевой сервер:</label>
                <div class="col-sm-8">
                    <input name="toServer" th:field="*{toServer}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Язык: cn — Китай, tw — Тайвань, kor — Корея, yn — Вьетнам, thai — Таиланд, ros — Сингапур/Малайзия, en — Английский:</label>
                <div class="col-sm-8">
                    <input name="language" th:field="*{language}" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Текущий этап:</label>
                <div class="col-sm-8">
                    <input name="step" th:field="*{step}" class="form-control" type="text" required>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/hefu";
        $("#form-hefu-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-hefu-edit').serialize());
            }
        }
    </script>
</body>
</html>
