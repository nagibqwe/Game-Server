<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список резервных копий БД')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="bakall()" shiro:hasPermission="gmtool:dbbak:add">
                    <i class="fa"></i> Резервное копирование всех
                </a>
                <a class="btn btn-success" onclick="restoreAll()" shiro:hasPermission="gmtool:dbbak:edit">
                    <i class="fa"></i> Восстановление всех
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>

            <input name="id" type="hidden" th:value="${id}" />
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('gmtool:dbbak:edit')}]];
        var removeFlag = [[${@permission.hasPermi('gmtool:dbbak:remove')}]];
        var prefix = ctx + "gmtool/hefu";
        var id = $(" input[ name='id' ] ").val();
        $(function() {
            var options = {
                url: prefix + "/bakList/",
                modalName: "Резервные копии БД",
                queryParams: {"id":id},
                columns: [
                //     {
                //     checkbox: true
                // },
                {
                    field: 'id',
                    title: 'ID',
                    visible: false
                },
                {
                    field: 'serverId',
                    title: 'ID сервера'
                },
                {
                    field: 'type',
                    title: 'Тип',
                    formatter: function(value, row, index) {
                        return value == 1 ? "Игровая БД" : "БД журналов";
                    }
                },
                {
                    field: 'createTime',
                    title: 'Время создания'
                },
                {
                    field: 'url',
                    title: 'Путь к резервной копии',
                    formatter: function(value, row, index) {
                        return value == null ? "" : value.length > 15 ? '<span title="'+value+'">'+value.substring(0,15) + "..."+'</span>' : value;
                    }
                },
                {
                    field: 'size',
                    title: 'Размер файла'
                },
                {
                    field: 'baking',
                    title: 'Статус',
                    formatter: function(value, row, index) {
                        return value == null ? "" : "В процессе";
                    }
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="bak('+row.serverId+','+row.type+')"><i class="fa"></i>Резервное копирование</a> ');
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="restore('+row.serverId+','+row.type+')"><i class="fa"></i>Восстановление</a> ');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        function bakall(){
            var reloadCacheUrl = prefix + "/dbbak";
            $.post(reloadCacheUrl, {id:id}, function (data,status){
                if(status =='success'){
                    if(data.code == 0){
                        $.modal.alertSuccess('Операция выполнена');
                    }else{
                        $.modal.alertError(data.msg);
                    }
                }else{
                    $.modal.alertError('Ошибка операции');
                }
            });
        }

        function bak(serverId, type){
            var reloadCacheUrl = prefix + "/dbbak";
            $.post(reloadCacheUrl, {id : id, serverId : serverId, type : type}, function (data,status){
                if(status =='success'){
                    if(data.code == 0){
                        $.modal.alertSuccess('Операция выполнена');
                    }else{
                        $.modal.alertError(data.msg);
                    }
                }else{
                    $.modal.alertError('Ошибка операции');
                }
            });
        }

        function restoreAll(){
            var reloadCacheUrl = prefix + "/dbrestore";
            $.modal.loading("Восстановление базы данных...");
            $.post(reloadCacheUrl, {id : id}, function (data,status){
                $.modal.closeLoading();
                if(status =='success'){
                    if(data.code == 0){
                        $.modal.alertSuccess('Операция выполнена');
                    }else{
                        $.modal.alertError(data.msg);
                    }
                }else{
                    $.modal.alertError('Ошибка операции');
                }
            });
        }

        function restore(serverId, type){
            var reloadCacheUrl = prefix + "/dbrestore";
            $.modal.loading("Восстановление базы данных...");
            $.post(reloadCacheUrl, {id : id, serverId : serverId, type : type}, function (data,status){
                $.modal.closeLoading();
                if(status =='success'){
                    if(data.code == 0){
                        $.modal.alertSuccess('Операция выполнена');
                    }else{
                        $.modal.alertError(data.msg);
                    }
                }else{
                    $.modal.alertError('Ошибка операции');
                }
            });
        }
    </script>
</body>
</html>
