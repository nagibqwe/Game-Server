<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Добавить объединение серверов')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-hefu-add">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Исходные серверы:</label>
                <div class="col-sm-8">
                    <input name="fromServer" placeholder="Несколько через запятую: 10001,10002" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Целевой сервер:</label>
                <div class="col-sm-8">
                    <input name="toServer" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Язык: cn — Китай, tw — Тайвань, kor — Корея, yn — Вьетнам, thai — Таиланд, ros — Сингапур/Малайзия, en — Английский:</label>
                <div class="col-sm-8">
                    <input name="language" class="form-control" type="text" required>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/hefu"
        $("#form-hefu-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-hefu-add').serialize());
            }
        }
    </script>
</body>
</html>
