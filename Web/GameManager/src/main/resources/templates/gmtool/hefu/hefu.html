<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список объединения серверов')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>Исходные серверы:</label>
                                <input type="text" name="fromServer"/>
                            </li>
                            <li>
                                <label>Целевой сервер:</label>
                                <input type="text" name="toServer"/>
                            </li>
                            <li>
                                <label>Статус объединения:</label>
                                <select name="status">
                                    <option value="">Все</option>
                                    <option value="0">Новое</option>
                                    <option value="1">В процессе</option>
                                    <option value="2">Успешно</option>
                                    <option value="3">Ошибка</option>
                                </select>
                            </li>
                            <li>
                                <label>Язык:</label>
                                <select name="language">
                                    <option value="">Все</option>
                                    <option value="cn">Китай</option>
                                    <option value="tw">Тайвань</option>
                                    <option value="kor">Корея</option>
                                    <option value="yn">Вьетнам</option>
                                    <option value="thai">Таиланд</option>
                                    <option value="ros">Сингапур/Малайзия</option>
                                    <option value="en">Английский</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="gmtool:hefu:add">
                    <i class="fa fa-plus"></i> Добавить
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="gmtool:hefu:edit">
                    <i class="fa fa-edit"></i> Редактировать
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="gmtool:hefu:remove">
                    <i class="fa fa-remove"></i> Удалить
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="gmtool:hefu:export">
                    <i class="fa fa-download"></i> Экспорт
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var startFlag = [[${@permission.hasPermi('gmtool:hefu:start')}]];
        var removeFlag = [[${@permission.hasPermi('gmtool:hefu:remove')}]];
        var prefix = ctx + "gmtool/hefu";
        var mytable;
        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "Объединение серверов",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'ID',
                    visible: false
                },
                {
                    field: 'fromServer',
                    title: 'Исходные серверы'
                },
                {
                    field: 'toServer',
                    title: 'Целевой сервер'
                },
                {
                    field: 'status',
                    title: 'Статус: 0 — новое, 1 — в процессе, 2 — успешно, 3 — ошибка',
                    formatter: function(value, row, index) {
                        var v = "";
                        if(value == 0){
                            v = "Новое";
                        }else if(value == 1){
                            v = "В процессе";
                        }else if(value == 2){
                            v = "Успешно";
                        }else if(value == 3){
                            v = "Ошибка";
                        }
                        return v;
                    }
                },
                {
                    field: 'log',
                    title: 'Журнал',
                    formatter: function(value, row, index) {
                        return '<a href="javascript:void(0)" onclick="showLog(' + row.id + ')">Просмотр журнала</a>';
                    }
                },
                {
                    field: 'language',
                    title: 'Язык: cn — Китай, tw — Тайвань, kor — Корея, yn — Вьетнам, thai — Таиланд, ros — Сингапур/Малайзия, en — Английский'
                },
                    {
                        field: 'createTime',
                        title: 'Время создания'
                    },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + startFlag + '" href="javascript:void(0)" onclick="check(\'' + row.id + '\')"><i class="fa"></i>Проверка конфигурации</a> ');
                        actions.push('<a class="btn btn-success btn-xs ' + startFlag + '" href="javascript:void(0)" onclick="bakAndRestore(\'' + row.id + '\')"><i class="fa"></i>Резервирование и восстановление</a> ');
                        actions.push('<a class="btn btn-success btn-xs ' + startFlag + '" href="javascript:void(0)" onclick="start(\'' + row.id + '\')"><i class="fa fa-hourglass-start"></i>Начать</a> ');
                        // actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="stop(\'' + row.id + '\')"><i class="fa fa-stop"></i>Остановить</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>Удалить</a>');
                        return actions.join('');
                    }
                }]
            };
            mytable = $.table.init(options);
        });

        function check(id){
            var reloadCacheUrl = prefix + "/check";
            $.post(reloadCacheUrl,{id:id},function (data,status){
                if(status =='success'){
                    if(data.code == 0){
                        $.modal.alertSuccess('Операция выполнена');
                    }else{
                        $.modal.alertError(data.msg);
                    }
                }else{
                    $.modal.alertError('Ошибка операции');
                }
            });
        }

        function start(id){
            $.modal.confirm("Серверы отключены? Нажмите \"Подтвердить\" для начала объединения",function(){
                var checkIsHefu = prefix + "/checkIsHefu";
                $.post(checkIsHefu,{id:id},function (data,status){
                    if(status =='success'){
                        if(data.code == 0){
                            sendStart(id);
                        }else{
                            $.modal.confirm(data.msg,function(){
                                sendStart(id);
                            });
                        }
                    }else{
                        $.modal.alertError('Ошибка операции');
                    }
                });
            })
        }

        function sendStart(id){
            var reloadCacheUrl = prefix + "/start";
            $.post(reloadCacheUrl,{id:id},function (data,status){
                if(status =='success'){
                    if(data.code == 0){
                        var startUrl = prefix + "/start/" + id;
                        $.modal.open("Журнал", startUrl);
                    }else{
                        $.modal.alertError(data.msg);
                    }
                }else{
                    $.modal.alertError('Ошибка операции');
                }
            });
        }

        function showLog(id){
            var url = prefix + "/log/" + id;
            $.modal.open("Журнал", url);
        }

        // function stop(id){
        //     var reloadCacheUrl = prefix + "/stop";
        //     $.post(reloadCacheUrl,function (data,status){
        //         if(status =='success'){
        //             if(data.code == 0){
        //                 $.modal.alertSuccess('Операция выполнена');
        //             }else{
        //                 $.modal.alertError(data.msg);
        //             }
        //         }else{
        //             $.modal.alertError('Ошибка операции');
        //         }
        //     });
        // }

        function bakAndRestore(id){
            var bakAndRestoreUrl = prefix + "/bakAndRestore/" + id;
            $.modal.open("Резервирование и восстановление", bakAndRestoreUrl);
        }
    </script>
</body>
</html>
