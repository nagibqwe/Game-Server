<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Управление магазином')" />
    <th:block th:include="include :: footer" />
    <script>
        $(function () {
            loadAllItem();
            formatDate();
        });
    </script>
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <div th:replace="common/select_server_single.html"></div>
                                <!-- Здесь настраивается сопоставление адресов групповых запросов к серверу -->
                                <input type="hidden" id="requestUrl" value="gameServer">
                                <input type="hidden" id="ignoreMerge" value="1">

                            </li>
                            <li>
                                <label>Тип магазина:</label>
                                <select id="select_shop" name="shopId" class="span2">
                                    <option value="0">Все</option>
                                    <option value="1">Магазин духовных нефритов</option>
                                    <option value="2">Обменный магазин</option>
                                    <option value="3">Магазин очков Благословенной земли</option>
                                    <option value="4">Магазин вклада в Бессмертный союз</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="addShop()">
                    <i class="fa fa-plus"></i> Добавить
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/shop";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                modalName: "Магазин",
                columns: [
                {
                    field: 'id',
                    title: 'ID товара'
                },
                {
                    field: 'itemid',
                    title: 'ID предмета',
                    formatter:getItemName
                },
                {
                    field: 'shopid',
                    title: 'Принадлежность к магазину',
                    formatter:function (value,row,index) {
                        switch (value) {
                            case 1:
                                return "Магазин духовных нефритов";
                            case 2:
                                return "Обменный магазин";
                            case 3:
                                return "Магазин очков Благословенной земли";
                            case 4:
                                return "Магазин вклада в Бессмертный союз";
                        }
                        return "Неизвестно: " + value;
                    }
                },
                {
                    field: 'shoptype',
                    title: 'Теги магазина'
                },
                {
                    field: 'labelid',
                    title: 'ID метки'
                },
                {
                    field: 'level',
                    title: 'Требуемый уровень'
                },
                {
                    field: 'occupation',
                    title: 'Ограничение по классу',
                    formatter:function (value,row,index) {
                        switch (value) {
                            case -1:
                                return "Все классы";
                            case 0:
                                return "Сюаньцзянь";
                            case 1:
                                return "Тяньин";
                            case 2:
                                return "Дицзан";
                            case 3:
                                return "Лоча";
                        }
                        return "Неизвестно: " + value;
                    }
                },
                {
                    field: 'limittype',
                    title: 'Тип ограничения покупки',
                    formatter:function (value,row,index) {
                        switch (value) {
                            case 0:
                                return "Без ограничений";
                            case 1:
                                return "Ежедневно";
                            case 2:
                                return "Еженедельно";
                            case 3:
                                return "Ежемесячно";
                            case 4:
                                return "Ежегодно";
                            case 5:
                                return "Навсегда";
                        }
                        return "Неизвестно: " + value;
                    }
                },
                {
                    field: 'buynum',
                    title: 'Количество покупок'
                },
                {
                    field: 'currencyid',
                    title: 'Валюта',
                    formatter:getItemName
                },
                {
                    field: 'price',
                    title: 'Цена до скидки'
                },
                {
                    field: 'discountprice',
                    title: 'Цена со скидкой'
                },
                {
                    field: 'discount',
                    title: 'Скидка (%)'
                },
                {
                    field: 'promotion',
                    title: 'Промо-тег',
                    formatter:function (value,row,index) {
                        switch (value) {
                            case 0:
                                return "Нет";
                            case 1:
                                return "Скидка";
                            case 2:
                                return "Рекомендуемый";
                            case 3:
                                return "Новинка";
                            case 4:
                                return "Хит";
                        }
                        return "Неизвестно: " + value;
                    }
                },
                {
                    field: 'sort',
                    title: 'Приоритет сортировки'
                },
                {
                    field: 'uptime',
                    title: 'Время публикации'
                },
                {
                    field: 'downtime',
                    title: 'Время снятия'
                },
                {
                    field: 'bind',
                    title: 'Привязка',
                    formatter:getBoolean
                },
                {
                    field: 'refreshcurrency',
                    title: 'Тип валюты для обновления'
                },
                {
                    field: 'refreshnum',
                    title: 'Количество валюты для обновления'
                },
                {
                    field: 'isdiscount',
                    title: 'Применять скидку к совершенствованию тела',
                    formatter:getBoolean
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs" href="javascript:void(0)" onclick="editShop(\'' + row.id + '\')"><i class="fa fa-edit"></i>Редактировать</a> ');
                        actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="deleteShop(\'' + row.id + '\')"><i class="fa fa-remove"></i>Удалить</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        function getItemName(value, row, index) {
            var itemName = items.get(value + "");
            if (itemName == undefined) {
                itemName = "Неизвестно";
            }
            return itemName + "[" + value + "]";
        }

        function getBoolean(value, row, index) {
            if (value == 0) {
                return "Нет";
            } else {
                return "Да";
            }
        }

        // Редактирование
        function editShop(id) {
            table.set();
            var groupName = $("#select_group").val();
            var serverId =  $("#select_server").val();
            $.modal.open("Редактировать " + table.options.modalName, prefix + "/editShop?shopId="+id+"&groupName="+groupName+"&serverId="+serverId,1450,null);
        }

        // Удаление
        function deleteShop(id) {
            $.modal.confirm("Подтвердить удаление?",function () {
                $.ajax({
                    type : "POST",
                    url : prefix + "/deleteShop",
                    data : {
                        serverId : $("#select_server").val(),
                        shopId : id
                    },
                    dataType : "json",
                    success : function(data) {
                        if (data.ok) {
                            $.table.refresh();
                            $.modal.alertSuccess(data.msg);
                        }else {
                            $.modal.alertError(data.msg);
                        }
                    }
                });
            });
        }

        // Добавление
        function addShop() {
            table.set();
            var groupName = $("#select_group").val();
            var serverId =  $("#select_server").val();
            $.modal.open("Добавить " + table.options.modalName, prefix + "/add?groupName="+groupName+"&serverId="+serverId+"",1450);
        }
    </script>
</body>
</html>
