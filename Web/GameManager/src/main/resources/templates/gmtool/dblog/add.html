<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Добавить журнал')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-dblog-add">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">ID сервера:</label>
                <div class="col-sm-8">
                    <input name="serverId" class="form-control" type="text" onblur="checkInput('serverId')" required>
                    <span id="checkServerId"></span>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Название сервера:</label>
                <div class="col-sm-8">
                    <input name="serverName" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Тип:</label>
                <div class="col-sm-8">
                    <select name="type" class="form-control m-b" required>
                        <option value="1">База данных журналов</option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Платформа:</label>
                <div class="col-sm-8">
                    <input name="groupName" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">IP базы данных:</label>
                <div class="col-sm-8">
                    <input name="dbIp" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Порт базы данных:</label>
                <div class="col-sm-8">
                    <input name="dbPort" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Название базы данных:</label>
                <div class="col-sm-8">
                    <input name="dbname" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Пользователь базы данных:</label>
                <div class="col-sm-8">
                    <input name="dbuser" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Пароль базы данных:</label>
                <div class="col-sm-8">
                    <input name="dbpassword" class="form-control" type="text" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Список объединённых серверов:</label>
                <div class="col-sm-8">
                    <textarea name="serverIdList" class="form-control"></textarea>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">Объединён:</label>
                <div class="col-sm-8">
                    <select name="isHeFu" class="form-control m-b">
                        <option value="0" th:checked="true">Нет</option>
                        <option value="1">Да</option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">ID целевого сервера:</label>
                <div class="col-sm-8">
                    <input name="hefuServerID" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Время объединения серверов:</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="hefuTime" class="form-control" placeholder="гггг-мм-дд чч:мм:сс" type="text">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Тип сервера:</label>
                <div class="col-sm-8">
                    <select name="serverType" class="form-control m-b" required>
                        <option value="0" selected>Тестовый сервер</option>
                        <option value="1">Основной сервер</option>
                        <option value="2">Сервер входа</option>
                        <option value="3">Общий сервер</option>
                        <option value="4">Межсерверный</option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">Активен:</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <input type="radio" id="isDeleted0" name="isDeleted" value="0" checked="checked">
                        <label for="isDeleted0">Да</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" id="isDeleted1" name="isDeleted" value="1">
                        <label for="isDeleted1">Нет</label>
                    </div>
                </div>
            </div>
            <!--<div class="form-group">    -->
                <!--<label class="col-sm-3 control-label">Время открытия сервера:</label>-->
                <!--<div class="col-sm-8">-->
                    <!--<input name="serverOpenTime" class="form-control" type="text">-->
                <!--</div>-->
            <!--</div>-->
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "gmtool/dblog"
        $("#form-dblog-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-dblog-add').serialize());
            }
        }

        $("input[name='hefuTime']").datetimepicker({
            // language:  'zh-CN',
            format : 'yyyy-mm-dd hh:ii:00',
            weekStart: 1,
            todayBtn:  1,
            autoclose: 1,
            startView : 2,
            minView : 0
        });
    </script>
</body>
</html>
