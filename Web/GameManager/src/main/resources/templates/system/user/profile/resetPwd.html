<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Смена пароля')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-user-resetPwd">
            <input name="userId"  type="hidden"  th:value="${user.userId}" />
            <div class="form-group">
                <label class="col-sm-3 control-label">Логин:</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" readonly="true" name="loginName" th:value="${user.loginName}"/>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Старый пароль:</label>
                <div class="col-sm-8">
                    <input class="form-control" type="password" name="oldPassword" id="oldPassword">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Новый пароль:</label>
                <div class="col-sm-8">
                    <input class="form-control" type="password" name="newPassword" id="newPassword">
                    <th:block th:with="chrtype=${@config.getKey('sys.account.chrtype')}">
                        <th:block th:if="${chrtype != '0'}">
                            <span class="help-block m-b-none">
                                <th:block th:if="${chrtype == '1'}"><i class="fa fa-info-circle" style="color: red;"></i> Пароль может содержать только цифры 0-9</th:block>
                                <th:block th:if="${chrtype == '2'}"><i class="fa fa-info-circle" style="color: red;"></i> Пароль может содержать только буквы a-z и A-Z</th:block>
                                <th:block th:if="${chrtype == '3'}"><i class="fa fa-info-circle" style="color: red;"></i> Пароль должен содержать буквы и цифры</th:block>
                                <th:block th:if="${chrtype == '4'}"><i class="fa fa-info-circle" style="color: red;"></i> Пароль должен содержать буквы, цифры и спецсимволы !@#$%^&*()-=_+</th:block>
                            </span>
                        </th:block>
                    </th:block>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Подтверждение:</label>
                <div class="col-sm-8">
                    <input class="form-control" type="password" name="confirmPassword" id="confirmPassword">
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> Повторите ввод пароля</span>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />

    <script>
        $("#form-user-resetPwd").validate({
            rules:{
                oldPassword:{
                    required:true,
                    remote: {
                        url: ctx + "system/user/profile/checkPassword",
                        type: "get",
                        dataType: "json",
                        data: {
                            password: function() {
                                return $("input[name='oldPassword']").val();
                            }
                        }
                    }
                },
                newPassword: {
                    required: true,
                    minlength: 5,
                    maxlength: 20
                },
                confirmPassword: {
                    required: true,
                    equalTo: "#newPassword"
                }
            },
            messages: {
                oldPassword: {
                    required: "Введите старый пароль",
                    remote: "Неверный старый пароль"
                },
                newPassword: {
                    required: "Введите новый пароль",
                    minlength: "Пароль должен содержать не менее 5 символов",
                    maxlength: "Пароль должен содержать не более 20 символов"
                },
                confirmPassword: {
                    required: "Подтвердите новый пароль",
                    equalTo: "Пароли не совпадают"
                }

            },
            focusCleanup: true
        });

        function submitHandler() {
            var chrtype = [[${#strings.defaultString(@config.getKey('sys.account.chrtype'), 0)}]];
            var password = $("#newPassword").val();
            if ($.validate.form() && checkpwd(chrtype, password)) {
                $.operate.save(ctx + "system/user/profile/resetPwd", $('#form-user-resetPwd').serialize());
            }
        }
    </script>
</body>

</html>
