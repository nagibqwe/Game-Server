<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список пользователей')" />
    <th:block th:include="include :: layout-latest-css" />
    <th:block th:include="include :: ztree-css" />
</head>
<body class="gray-bg">
    <div class="ui-layout-west">
        <div class="box box-main">
            <div class="box-header">
                <div class="box-title">
                    <i class="fa icon-grid"></i> Организационная структура
                </div>
                <div class="box-tools pull-right">
                    <a type="button" class="btn btn-box-tool" href="#" onclick="dept()" title="Управление отделами"><i class="fa fa-edit"></i></a>
                    <button type="button" class="btn btn-box-tool" id="btnExpand" title="Развернуть" style="display:none;"><i class="fa fa-chevron-up"></i></button>
                    <button type="button" class="btn btn-box-tool" id="btnCollapse" title="Свернуть"><i class="fa fa-chevron-down"></i></button>
                    <button type="button" class="btn btn-box-tool" id="btnRefresh" title="Обновить отделы"><i class="fa fa-refresh"></i></button>
                </div>
            </div>
            <div class="ui-layout-content">
                <div id="tree" class="ztree"></div>
            </div>
        </div>
    </div>

    <div class="ui-layout-center">
        <div class="container-div">
            <div class="row">
                <div class="col-sm-12 search-collapse">
                    <form id="user-form">
                        <input type="hidden" id="deptId" name="deptId">
                        <input type="hidden" id="parentId" name="parentId">
                        <div class="select-list">
                            <ul>
                                <li>
                                    Логин: <input type="text" name="loginName"/>
                                </li>
                                <li>
                                    Номер телефона: <input type="text" name="phonenumber"/>
                                </li>
                                <li>
                                    Статус пользователя: <select name="status" th:with="type=${@dict.getType('sys_normal_disable')}">
                                        <option value="">Все</option>
                                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                    </select>
                                </li>
                                <li class="select-time">
                                    <label>Время создания:</label>
                                    <input type="text" class="time-input" id="startTime" placeholder="Начало" name="params[beginTime]"/>
                                    <span>-</span>
                                    <input type="text" class="time-input" id="endTime" placeholder="Окончание" name="params[endTime]"/>
                                </li>
                                <li>
                                    <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                    <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                                </li>
                            </ul>
                        </div>
                    </form>
                </div>

                <div class="btn-group-sm" id="toolbar" role="group">
                    <a class="btn btn-success" onclick="$.operate.addTab()" shiro:hasPermission="system:user:add">
                        <i class="fa fa-plus"></i> Добавить
                    </a>
                    <a class="btn btn-primary single disabled" onclick="$.operate.editTab()" shiro:hasPermission="system:user:edit">
                        <i class="fa fa-edit"></i> Редактировать
                    </a>
                    <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:user:remove">
                        <i class="fa fa-remove"></i> Отключить
                    </a>
                    <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="system:user:import">
                        <i class="fa fa-upload"></i> Импорт
                    </a>
                    <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:user:export">
                        <i class="fa fa-download"></i> Экспорт
                    </a>
                </div>

                <div class="col-sm-12 select-table table-striped">
                    <table id="bootstrap-table"></table>
                </div>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
    <th:block th:include="include :: layout-latest-js" />
    <th:block th:include="include :: ztree-js" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:user:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:user:remove')}]];
        var resetPwdFlag = [[${@permission.hasPermi('system:user:resetPwd')}]];
        var prefix = ctx + "system/user";

        $(function() {
            var panehHidden = false;
            if ($(this).width() < 769) {
                panehHidden = true;
            }
            $('body').layout({ initClosed: panehHidden, west__size: 185 });
            // Привязка кнопки "Наверх"
            if ($.fn.toTop !== undefined) {
                var opt = {
                    win:$('.ui-layout-center'),
                    doc:$('.ui-layout-center')
                };
                $('#scroll-up').toTop(opt);
            }
            queryUserList();
            queryDeptTree();
        });

        function queryUserList() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                importUrl: prefix + "/importData",
                importTemplateUrl: prefix + "/importTemplate",
                sortName: "createTime",
                sortOrder: "desc",
                modalName: "Пользователи",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'userId',
                    title: 'ID пользователя'
                },
                {
                    field: 'loginName',
                    title: 'Логин',
                    sortable: true
                },
                {
                    field: 'userName',
                    title: 'Имя пользователя'
                },
                {
                    field: 'dept.deptName',
                    title: 'Отдел'
                },
                {
                    field: 'email',
                    title: 'Email',
                    visible: false
                },
                {
                    field: 'phonenumber',
                    title: 'Телефон'
                },
                {
                    visible: editFlag == 'hidden' ? false : true,
                    title: 'Статус пользователя',
                    align: 'center',
                    formatter: function (value, row, index) {
                        return statusTools(row);
                    }
                },
                {
                    field: 'createTime',
                    title: 'Время создания',
                    sortable: true
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editTab(\'' + row.userId + '\')"><i class="fa fa-edit"></i>Редактировать</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.userId + '\')"><i class="fa fa-remove"></i>Отключить</a> ');
                        var more = [];
                        more.push("<a class='btn btn-default btn-xs " + resetPwdFlag + "' href='javascript:void(0)' onclick='resetPwd(" + row.userId + ")'><i class='fa fa-key'></i>Сброс пароля</a> ");
                        more.push("<a class='btn btn-default btn-xs " + editFlag + "' href='javascript:void(0)' onclick='authRole(" + row.userId + ")'><i class='fa fa-check-square-o'></i>Назначить роли</a>");
                        actions.push('<a tabindex="0" class="btn btn-info btn-xs" role="button" data-container="body" data-placement="left" data-toggle="popover" data-html="true" data-trigger="hover" data-content="' + more.join('') + '"><i class="fa fa-chevron-circle-right"></i>Ещё</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        }

        function queryDeptTree()
        {
            var url = ctx + "system/dept/treeData";
            var options = {
                url: url,
                expandLevel: 2,
                onClick : zOnClick
            };
            $.tree.init(options);

            function zOnClick(event, treeId, treeNode) {
                $("#deptId").val(treeNode.id);
                $("#parentId").val(treeNode.pId);
                $.table.search();
            }
        }

        $('#btnExpand').click(function() {
            $._tree.expandAll(true);
            $(this).hide();
            $('#btnCollapse').show();
        });

        $('#btnCollapse').click(function() {
            $._tree.expandAll(false);
            $(this).hide();
            $('#btnExpand').show();
        });

        $('#btnRefresh').click(function() {
            queryDeptTree();
        });

        /* Управление пользователями — отделы */
        function dept() {
            var url = ctx + "system/dept";
            $.modal.openTab("Отделы", url);
        }

        /* Управление пользователями — сброс пароля */
        function resetPwd(userId) {
            var url = prefix + '/resetPwd/' + userId;
            $.modal.open("Сброс пароля", url, '800', '300');
        }

        /* Управление пользователями — назначение ролей */
        function authRole(userId) {
            var url = prefix + '/authRole/' + userId;
            $.modal.openTab("Назначение ролей пользователю", url);
        }

        /* Отображение статуса пользователя */
        function statusTools(row) {
            if (row.status == 1) {
                return '<i class=\"fa fa-toggle-off text-info fa-2x\" onclick="enable(\'' + row.userId + '\')"></i> ';
            } else {
                return '<i class=\"fa fa-toggle-on text-info fa-2x\" onclick="disable(\'' + row.userId + '\')"></i> ';
            }
        }

        /* Управление пользователями — отключение */
        function disable(userId) {
            $.modal.confirm("Подтвердить отключение пользователя?", function() {
                $.operate.post(prefix + "/changeStatus", { "userId": userId, "status": 1 });
            })
        }

        /* Управление пользователями — включение */
        function enable(userId) {
            $.modal.confirm("Подтвердить включение пользователя?", function() {
                $.operate.post(prefix + "/changeStatus", { "userId": userId, "status": 0 });
            })
        }
    </script>
</body>
<!-- Область импорта -->
<script id="importTpl" type="text/template">
<form enctype="multipart/form-data" class="mt20 mb10">
    <div class="col-xs-offset-1">
        <input type="file" id="file" name="file"/>
        <div class="mt10 pt5">
            <input type="checkbox" id="updateSupport" name="updateSupport" title="Если пользователь уже существует, обновить данные."> Обновить существующих пользователей
             &nbsp; <a onclick="$.table.importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i> Скачать шаблон</a>
        </div>
        <font color="red" class="pull-left mt10">
            Примечание: разрешены только файлы форматов "xls" или "xlsx"!
        </font>
    </div>
</form>
</script>
</html>
