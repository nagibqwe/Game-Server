<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список отделов')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="dept-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                Название отдела: <input type="text" name="deptName"/>
                            </li>
                            <li>
                                Статус отдела: <select name="status" th:with="type=${@dict.getType('sys_normal_disable')}">
                                    <option value="">Все</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.treeTable.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add(100)" shiro:hasPermission="system:dept:add">
                    <i class="fa fa-plus"></i> Добавить
                </a>
                <a class="btn btn-primary" onclick="$.operate.edit()" shiro:hasPermission="system:dept:edit">
                    <i class="fa fa-edit"></i> Редактировать
                </a>
                <a class="btn btn-info" id="expandAllBtn">
                    <i class="fa fa-exchange"></i> Развернуть/Свернуть
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-tree-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var addFlag = [[${@permission.hasPermi('system:dept:add')}]];
        var editFlag = [[${@permission.hasPermi('system:dept:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:dept:remove')}]];
        var datas = [[${@dict.getType('sys_normal_disable')}]];
        var prefix = ctx + "system/dept"

        $(function() {
            var options = {
                code: "deptId",
                parentCode: "parentId",
                uniqueId: "deptId",
                url: prefix + "/list",
                createUrl: prefix + "/add/{id}",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove/{id}",
                modalName: "Отделы",
                columns: [{
                    field: 'selectItem',
                    radio: true
                },
                {
                    field: 'deptName',
                    title: 'Название отдела',
                    align: "left"
                },
                {
                    field: 'orderNum',
                    title: 'Порядок сортировки',
                    align: "left"
                },
                {
                    field: 'status',
                    title: 'Статус',
                    align: "left",
                    formatter: function(value, item, index) {
                        return $.table.selectDictLabel(datas, item.status);
                    }
                },
                {
                    field: 'createTime',
                    title: 'Время создания',
                    align: "left"
                },
                {
                    title: 'Действия',
                    align: 'left',
                    formatter: function(value, row, index) {
                        if (row.parentId != 0) {
                            var actions = [];
                            actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.deptId + '\')"><i class="fa fa-edit"></i>Редактировать</a> ');
                            actions.push('<a class="btn btn-info  btn-xs ' + addFlag + '" href="javascript:void(0)" onclick="$.operate.add(\'' + row.deptId + '\')"><i class="fa fa-plus"></i>Добавить</a> ');
                            actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.deptId + '\')"><i class="fa fa-trash"></i>Удалить</a>');
                            return actions.join('');
                        } else {
                            return "";
                        }
                    }
                }]
            };
            $.treeTable.init(options);
        });
    </script>
</body>
</html>
