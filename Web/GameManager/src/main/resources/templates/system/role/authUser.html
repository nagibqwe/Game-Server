<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Назначение пользователей роли')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="role-form">
                    <input type="hidden" id="roleId" name="roleId" th:value="${role.roleId}">
                    <div class="select-list">
                        <ul>
                            <li>
                                Логин: <input type="text" name="loginName"/>
                            </li>
                            <li>
                                Номер телефона: <input type="text" name="phonenumber"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="selectUser()" shiro:hasPermission="system:role:add">
                    <i class="fa fa-plus"></i> Добавить пользователя
                </a>
                <a class="btn btn-danger multiple disabled" onclick="cancelAuthUserAll()" shiro:hasPermission="system:role:remove">
                    <i class="fa fa-remove"></i> Отозвать права (массово)
                </a>
                <a class="btn btn-warning" onclick="closeItem()">
                    <i class="fa fa-reply-all"></i> Закрыть
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var removeFlag = [[${@permission.hasPermi('system:role:remove')}]];
        var datas = [[${@dict.getType('sys_normal_disable')}]];
        var prefix = ctx + "system/role/authUser";

        $(function() {
            var options = {
                url: prefix + "/allocatedList",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                importUrl: prefix + "/importData",
                importTemplateUrl: prefix + "/importTemplate",
                queryParams: queryParams,
                sortName: "createTime",
                sortOrder: "desc",
                modalName: "Пользователи",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'userId',
                    title: 'ID пользователя',
                    visible: false
                },
                {
                    field: 'loginName',
                    title: 'Логин',
                    sortable: true
                },
                {
                    field: 'userName',
                    title: 'Имя пользователя'
                },
                {
                    field: 'email',
                    title: 'Email'
                },
                {
                    field: 'phonenumber',
                    title: 'Телефон'
                },
                {
                    field: 'status',
                    title: 'Статус пользователя',
                    align: 'center',
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(datas, value);
                    }
                },
                {
                    field: 'createTime',
                    title: 'Время создания',
                    sortable: true
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="cancelAuthUser(\'' + row.userId + '\')"><i class="fa fa-remove"></i>Отозвать права</a> ');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        function queryParams(params) {
            var search = $.table.queryParams(params);
            search.roleId = $("#roleId").val();
            return search;
        }

        /* Назначение пользователей — выбор пользователя */
        function selectUser() {
            var url = prefix + '/selectUser/' + $("#roleId").val();
            $.modal.open("Выбор пользователя", url);
        }

        /* Назначение пользователей — массовый отзыв прав */
        function cancelAuthUserAll(userId) {
            var rows = $.table.selectFirstColumns();
            if (rows.length == 0) {
                $.modal.alertWarning("Выберите хотя бы одну запись");
                return;
            }
            $.modal.confirm("Подтвердить отзыв прав для выбранных " + rows.length + " записей?", function() {
                var data = { "roleId": $("#roleId").val(), "userIds": rows.join() };
                $.operate.submit(prefix + "/cancelAll", "post", "json", data);
            });
        }

        /* Назначение пользователей — отзыв прав у одного пользователя */
        function cancelAuthUser(userId) {
            $.modal.confirm("Подтвердить отзыв прав у этого пользователя?", function() {
                $.operate.post(prefix + "/cancel", { "roleId": $("#roleId").val(), "userId": userId });
            })
        }
    </script>
</body>
</html>
