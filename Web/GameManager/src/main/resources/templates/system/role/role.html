<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('Список ролей')" />
</head>
<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="role-form">
                    <div class="select-list">
                        <ul>
                            <li>
                                Название роли: <input type="text" name="roleName"/>
                            </li>
                            <li>
                                Ключ прав доступа: <input type="text" name="roleKey"/>
                            </li>
                            <li>
                                Статус роли: <select name="status" th:with="type=${@dict.getType('sys_normal_disable')}">
                                    <option value="">Все</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li class="select-time">
                                <label>Время создания:</label>
                                <input type="text" class="time-input" id="startTime" placeholder="Начало" name="params[beginTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" id="endTime" placeholder="Окончание" name="params[endTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:role:add">
                    <i class="fa fa-plus"></i> Добавить
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:role:edit">
                    <i class="fa fa-edit"></i> Редактировать
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:role:remove">
                    <i class="fa fa-remove"></i> Удалить
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:role:export">
                    <i class="fa fa-download"></i> Экспорт
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:role:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:role:remove')}]];
        var prefix = ctx + "system/role";


        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                sortName: "roleSort",
                modalName: "Роли",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'roleId',
                    title: 'ID роли'
                },
                {
                    field: 'roleName',
                    title: 'Название роли',
                    sortable: true
                },
                {
                    field: 'roleKey',
                    title: 'Ключ прав доступа',
                    sortable: true
                },
                {
                    field: 'roleSort',
                    title: 'Порядок отображения',
                    sortable: true
                },
                {
                    visible: editFlag == 'hidden' ? false : true,
                    title: 'Статус роли',
                    align: 'center',
                    formatter: function (value, row, index) {
                        return statusTools(row);
                    }
                },
                {
                    field: 'createTime',
                    title: 'Время создания',
                    sortable: true
                },
                {
                    title: 'Действия',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.roleId + '\')"><i class="fa fa-edit"></i>Редактировать</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.roleId + '\')"><i class="fa fa-remove"></i>Удалить</a> ');
                        var more = [];
                        more.push("<a class='btn btn-default btn-xs " + editFlag + "' href='javascript:void(0)' onclick='authDataScope(" + row.roleId + ")'><i class='fa fa-check-square-o'></i>Права доступа</a> ");
                        more.push("<a class='btn btn-default btn-xs " + editFlag + "' href='javascript:void(0)' onclick='authUser(" + row.roleId + ")'><i class='fa fa-user'></i>Назначить пользователей</a>");
                        actions.push('<a tabindex="0" class="btn btn-info btn-xs" role="button" data-container="body" data-placement="left" data-toggle="popover" data-html="true" data-trigger="hover" data-content="' + more.join('') + '"><i class="fa fa-chevron-circle-right"></i>Ещё</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        /* Управление ролями — назначение прав доступа к данным */
        function authDataScope(roleId) {
            var url = prefix + '/authDataScope/' + roleId;
            $.modal.open("Права доступа к данным", url);
        }

        /* Управление ролями — назначение пользователей */
        function authUser(roleId) {
            var url = prefix + '/authUser/' + roleId;
            $.modal.openTab("Назначить пользователей", url);
        }

        /* Отображение статуса роли */
        function statusTools(row) {
            if (row.status == 1) {
                return '<i class=\"fa fa-toggle-off text-info fa-2x\" onclick="enable(\'' + row.roleId + '\')"></i> ';
            } else {
                return '<i class=\"fa fa-toggle-on text-info fa-2x\" onclick="disable(\'' + row.roleId + '\')"></i> ';
            }
        }

        /* Управление ролями — отключение */
        function disable(roleId) {
            $.modal.confirm("Подтвердить отключение роли?", function() {
                $.operate.post(prefix + "/changeStatus", { "roleId": roleId, "status": 1 });
            })
        }

        /* Управление ролями — включение */
        function enable(roleId) {
            $.modal.confirm("Подтвердить включение роли?", function() {
                $.operate.post(prefix + "/changeStatus", { "roleId": roleId, "status": 0 });
            })
        }
    </script>
</body>
</html>
