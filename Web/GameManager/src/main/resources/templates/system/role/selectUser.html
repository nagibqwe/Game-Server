<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Выбор пользователей для назначения роли')" />
</head>

<body class="gray-bg">
    <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="role-form">
                    <input type="hidden" id="roleId" name="roleId" th:value="${role.roleId}">
                    <div class="select-list">
                        <ul>
                            <li>
                                Логин: <input type="text" name="loginName"/>
                            </li>
                            <li>
                                Номер телефона: <input type="text" name="phonenumber"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;Поиск</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;Сброс</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var datas = [[${@dict.getType('sys_normal_disable')}]];
        var prefix = ctx + "system/role/authUser";

        $(function() {
            var options = {
                url: prefix + "/unallocatedList",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                importUrl: prefix + "/importData",
                importTemplateUrl: prefix + "/importTemplate",
                queryParams: queryParams,
                sortName: "createTime",
                sortOrder: "desc",
                modalName: "Пользователи",
                showSearch: false,
                showRefresh: false,
                showToggle: false,
                showColumns: false,
                clickToSelect: true,
                rememberSelected: true,
                columns: [{
                    field: 'state',
                    checkbox: true
                },
                {
                    field: 'userId',
                    title: 'ID пользователя',
                    visible: false
                },
                {
                    field: 'loginName',
                    title: 'Логин',
                    sortable: true
                },
                {
                    field: 'userName',
                    title: 'Имя пользователя'
                },
                {
                    field: 'email',
                    title: 'Email'
                },
                {
                    field: 'phonenumber',
                    title: 'Телефон'
                },
                {
                    field: 'status',
                    title: 'Статус пользователя',
                    align: 'center',
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(datas, value);
                    }
                },
                {
                    field: 'createTime',
                    title: 'Время создания',
                    sortable: true
                }]
            };
            $.table.init(options);
        });

        function queryParams(params) {
            var search = $.table.queryParams(params);
            search.roleId = $("#roleId").val();
            return search;
        }

        /* Добавление пользователей — выбор пользователей — отправка */
        function submitHandler() {
            var rows = $.table.selectFirstColumns();
            if (rows.length == 0) {
                $.modal.alertWarning("Выберите хотя бы одну запись");
                return;
            }
            var data = { "roleId": $("#roleId").val(), "userIds": rows.join() };
            $.operate.save(prefix + "/selectAll", data);
        }
    </script>
</body>
</html>
