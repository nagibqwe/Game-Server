<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('Добавить пункт меню')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-menu-add">
            <input id="treeId" name="parentId" type="hidden" th:value="${menu.menuId}" />
            <div class="form-group">
                <label class="col-sm-3 control-label">Родительское меню:</label>
                <div class="col-sm-8">
                    <div class="input-group">
                        <input class="form-control" type="text" onclick="selectMenuTree()" id="treeName" readonly="true" th:value="${menu.menuName}">
                        <span class="input-group-addon"><i class="fa fa-search"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Тип меню:</label>
                <div class="col-sm-8">
                    <label class="radio-box"> <input type="radio" name="menuType" value="M" /> Каталог </label>
                    <label class="radio-box"> <input type="radio" name="menuType" value="C" /> Меню </label>
                    <label class="radio-box"> <input type="radio" name="menuType" value="F" /> Кнопка </label>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Название меню:</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="menuName" id="menuName" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">URL-адрес:</label>
                <div class="col-sm-8">
                    <input id="url" name="url" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Способ открытия:</label>
                <div class="col-sm-8">
                    <select id="target" name="target" class="form-control m-b">
                        <option value="menuItem">Вкладка</option>
                        <option value="menuBlank">Новое окно</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Ключ прав доступа:</label>
                <div class="col-sm-8">
                    <input id="perms" name="perms" class="form-control" type="text">
                    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> Ключ прав, определённый в контроллере, например: @RequiresPermissions("")</span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">Порядок отображения:</label>
                <div class="col-sm-8">
                    <input class="form-control" type="text" name="orderNum" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Иконка:</label>
                <div class="col-sm-8">
                    <input id="icon" name="icon" class="form-control" type="text" placeholder="Выберите иконку">
                    <div class="ms-parent" style="width: 100%;">
                        <div class="icon-drop animated flipInX" style="display: none;max-height:200px;overflow-y:auto">
                            <div data-th-include="system/menu/icon"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">Статус меню:</label>
                <div class="col-sm-3">
                    <div class="radio-box" th:each="dict : ${@dict.getType('sys_show_hide')}">
                        <input type="radio" th:id="${dict.dictCode}" name="visible" th:value="${dict.dictValue}" th:checked="${dict.default}">
                        <label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
                    </div>
                </div>
                <label class="col-sm-2 control-label is-refresh" title="Обновлять страницу при открытии вкладки меню">Обновлять:<i class="fa fa-question-circle-o"></i></label>
                <div class="col-sm-3 is-refresh">
                    <div class="radio-box">
                        <input type="radio" id="refresh-no" name="isRefresh" value="1" checked>
                        <label for="refresh-no">Нет</label>
                    </div>
                    <div class="radio-box">
                        <input type="radio" id="refresh-yes" name="isRefresh" value="0">
                        <label for="refresh-yes">Да</label>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script>
        var prefix = ctx + "system/menu";

        $("#form-menu-add").validate({
            onkeyup: false,
            rules:{
                menuType:{
                    required:true,
                },
                menuName:{
                    remote: {
                        url: prefix + "/checkMenuNameUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            "parentId": function() {
                                return $("input[name='parentId']").val();
                            },
                            "menuName" : function() {
                                return $.common.trim($("#menuName").val());
                            }
                        },
                        dataFilter: function(data, type) {
                            return $.validate.unique(data);
                        }
                    }
                },
                orderNum:{
                    digits:true
                },
            },
            messages: {
                "menuName": {
                    remote: "Пункт меню уже существует"
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-menu-add').serialize());
            }
        }

        $(function() {
            $("input[name='icon']").focus(function() {
                $(".icon-drop").show();
            });
            $("#form-menu-add").click(function(event) {
                var obj = event.srcElement || event.target;
                if (!$(obj).is("input[name='icon']")) {
                    $(".icon-drop").hide();
                }
            });
            $(".icon-drop").find(".ico-list i").on("click", function() {
                $('#icon').val($(this).attr('class'));
            });
            $('input').on('ifChecked', function(event){
                var menuType = $(event.target).val();
                if (menuType == "M") {
                    $("#url").parents(".form-group").hide();
                    $("#perms").parents(".form-group").hide();
                    $("#icon").parents(".form-group").show();
                    $("#target").parents(".form-group").hide();
                    $("input[name='visible']").parents(".form-group").show();
                    $(".is-refresh").hide();
                } else if (menuType == "C") {
                    $("#url").parents(".form-group").show();
                    $("#perms").parents(".form-group").show();
                    $("#icon").parents(".form-group").show();
                    $("#target").parents(".form-group").show();
                    $("input[name='visible']").parents(".form-group").show();
                    $(".is-refresh").show();
                } else if (menuType == "F") {
                    $("#url").parents(".form-group").hide();
                    $("#perms").parents(".form-group").show();
                    $("#icon").parents(".form-group").hide();
                    $("#target").parents(".form-group").hide();
                    $("input[name='visible']").parents(".form-group").hide();
                    $(".is-refresh").hide();
                }
            });
        });

        /* Управление меню — выбор родительского меню */
        function selectMenuTree() {
            var treeId = $("#treeId").val();
            var menuId = treeId > 0 ? treeId : 1;
            var url = prefix + "/selectMenuTree/" + menuId;
            var options = {
                title: 'Выбор меню',
                width: "380",
                url: url,
                callBack: doSubmit
            };
            $.modal.openOptions(options);
        }

        function doSubmit(index, layero){
            var body = layer.getChildFrame('body', index);
            $("#treeId").val(body.find('#treeId').val());
            $("#treeName").val(body.find('#treeName').val());
            layer.close(index);
        }
    </script>
</body>
</html>
