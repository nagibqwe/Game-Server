# Конфигурация, связанная с проектом
gm:
  # Название
  name: GameManager
  # Версия
  version: 4.6.1
  # Год копирайта
  copyrightYear: 2021
  # Включение демо-режима
  demoEnabled: false
  # Путь к файлам (пример: Windows D:/gm/uploadPath, Linux /home/gm/uploadPath)
  profile: /home/gm/uploadPath
  # Включение определения IP-адреса
  addressEnabled: false
  # Ключ запроса между GM-админкой и сервером
  requestServerKey: 753509031ad2ced8d284f0f20f4277a8
  # Идентификатор игры
  gameID: 1001
  # Адрес подключения к APIServer
  APIServerUrl: http://94.250.249.128:8080/APIServer
  # Объединение серверов — расположение сохранения файлов
  hefudir: /data/game/gm/hefudir
  # Объединение серверов — обновление конфигурации сервера
  platUpdateUrl: http://94.250.249.128:8080/PlatformKits/serverListConfig/server/refreshServer

# Конфигурация среды разработки
server:
  # HTTP-порт сервера, по умолчанию 80
  port: 8098
  servlet:
    # Путь доступа к приложению
    context-path: /
  tomcat:
    # Кодировка URI в tomcat
    uri-encoding: UTF-8
    # Максимальное количество потоков tomcat, по умолчанию 200
    max-threads: 800
    # Количество потоков инициализации при запуске Tomcat, по умолчанию 25
    min-spare-threads: 30

# Конфигурация логирования
logging:
  level:
    com.gm: debug
    org.springframework: warn

# Конфигурация пользователя
user:
  password:
    # Блокировка на 10 минут после {maxRetryCount} ошибок пароля
    maxRetryCount: 99

# Конфигурация Spring
spring:
  # Шаблонизатор
  thymeleaf:
    mode: HTML
    encoding: utf-8
    # Отключение кэширования
    cache: false
  # Информация о ресурсах
  messages:
    # Путь к файлам интернационализации ресурсов
    basename: static/i18n/messages
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: druid
  # Загрузка файлов
  servlet:
    multipart:
      # Максимальный размер одного файла
      max-file-size: 10MB
      # Максимальный общий размер загружаемых файлов
      max-request-size: 20MB
  # Модуль сервиса
  devtools:
    restart:
      # Включение горячего развертывания
      enabled: false

# MyBatis
mybatis:
  # Поиск псевдонимов пакетов
  typeAliasesPackage: com.gm.project.**.domain
  # Настройка сканирования mapper.xml
  mapperLocations: classpath:mybatis/**/*Mapper.xml
  # Загрузка глобального конфигурационного файла
  configLocation: classpath:mybatis/mybatis-config.xml

# Плагин постраничного разделения PageHelper
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

# Shiro
shiro:
  user:
    # Адрес входа
    loginUrl: /login
    # Адрес при ошибке авторизации
    unauthorizedUrl: /unauth
    # Адрес главной страницы
    indexUrl: /index
    # Включение капчи
    captchaEnabled: false
    # Тип капчи: math — вычисления, char — символы
    captchaType: math
  cookie:
    # Домен Cookie (по умолчанию пусто — текущий домен)
    domain:
    # Путь доступа Cookie
    path: /
    # Установка атрибута HttpOnly
    httpOnly: true
    # Время жизни Cookie в днях
    maxAge: 30
    # Ключ шифрования (обязательно уникальный)
    cipherKey: zSyK5Kp6PZAAjlT+eeNMlg==
  session:
    # Время сессии, -1 означает бессрочно (по умолчанию 30 минут)
    expireTime: -1
    # Период синхронизации сессии с БД (по умолчанию 1 минута)
    dbSyncPeriod: 1
    # Интервал проверки активности сессии (по умолчанию 10 минут)
    validationInterval: 10
    # Максимальное количество сессий на одного пользователя (-1 без ограничений)
    maxSession: -1
    # Выгнать предыдущего/последующего пользователя (по умолчанию предыдущего)
    kickoutAfter: false

# Защита от XSS-атак
xss:
  # Включение фильтрации
  enabled: true
  # Исключаемые ссылки (через запятую)
  excludes: /system/notice/*
  # Сопоставляемые ссылки
  urlPatterns: /system/*,/monitor/*,/tool/*

# Конфигурация Swagger
swagger:
  # Включение Swagger
  enabled: true

# Генерация кода
gen:
  # Автор
  author: gm
  # Пакет по умолчанию (укажите свой модуль: system, monitor, tool)
  packageName: com.gm.project.system
  # Автоматическое удаление префикса таблицы (по умолчанию true)
  autoRemovePre: true
  # Префиксы таблиц (не включаются в имя класса, через запятую)
  tablePrefix: sys_